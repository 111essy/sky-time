<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
  background: black;
}
</style>
</head>
<body>
<svg viewBox="-420 -420 840 840" style="max-width: 382.5px;">
<circle cx="0" cy="0" r="200" fill="none" stroke="grey" stroke-width="2" />
<circle cx="0" cy="0" r="250" fill="none" stroke="grey" stroke-width="2" />
<circle cx="0" cy="0" r="300" fill="none" stroke="grey" stroke-width="2" />
<circle cx="0" cy="0" r="150" fill="none" stroke="grey" stroke-width="2" />
<g id="ticks-hours"></g>
<g id="ticks-lunar"></g>
<g id="ticks-solar"></g>
<g id="ticks-clock"></g>
<g id="hand-solar">
<line x1="0" y1="-250" x2="0" y2="-288" stroke="crimson" stroke-width="6" stroke-linecap="round" />
</g>
<g id="hand-lunar">
<line x1="0" y1="-200" x2="0" y2="-238" stroke="crimson" stroke-width="6" stroke-linecap="round" />
</g>
<g id="hand-hours">
<line x1="0" y1="-150" x2="0" y2="-188" stroke="crimson" stroke-width="6" stroke-linecap="round" />
</g>
<g id="hand-clock-hour">
<line x1="0" y1="0" x2="0" y2="-70" stroke="crimson" stroke-width="8" stroke-linecap="round" />
</g>
<g id="hand-clock-minute">
<line x1="0" y1="0" x2="0" y2="-110" stroke="crimson" stroke-width="5" stroke-linecap="round" />
</g>
<g id="hand-clock-second">
<line x1="0" y1="0" x2="0" y2="-130" stroke="crimson" stroke-width="2" stroke-linecap="round" />
</g>
<circle cx="0" cy="0" r="7" fill="crimson" />
</svg>
<script>
var svgNS = "http://www.w3.org/2000/svg";
var cx = 0, cy = 0;

// Copied verbatim from files/calendar-mechanism.html (there named ph, not phJDE)
var R = Math.PI / 180;
var SM = 29.530589;
function ph(k,q){ // JDE of lunar phase: q=0 new, 0.5 full (Meeus ch.49, full 16-term series)
  var T=k/1236.85;
  var J=2451550.09766+29.530588861*(k+q)+0.00015437*T*T;
  var E=1-0.002516*T-0.0000074*T*T, kk=k+q;
  var M=(2.5534+29.10535670*kk)*R, Mp=(201.5643+385.81693528*kk)*R, F=(160.7108+390.67050284*kk)*R;
  var Om=(124.7746-1.56375588*k)*R;
  var tail = -0.00111*Math.sin(Mp-2*F) - 0.00057*Math.sin(Mp+2*F) + 0.00056*E*Math.sin(2*Mp+M)
    - 0.00042*Math.sin(3*Mp) + 0.00042*E*Math.sin(M+2*F) + 0.00038*E*Math.sin(M-2*F)
    - 0.00024*E*Math.sin(2*Mp-M) - 0.00017*Math.sin(Om) - 0.00007*Math.sin(Mp+2*M);
  if(q===0.5){
    return J-0.40614*Math.sin(Mp)+0.17302*E*Math.sin(M)+0.01614*Math.sin(2*Mp)
      +0.01043*Math.sin(2*F)+0.00734*E*Math.sin(Mp-M)-0.00514*E*Math.sin(Mp+M)
      +0.00209*E*E*Math.sin(2*M)+tail;
  }
  return J-0.40720*Math.sin(Mp)+0.17241*E*Math.sin(M)+0.01608*Math.sin(2*Mp)
    +0.01039*Math.sin(2*F)+0.00739*E*Math.sin(Mp-M)-0.00514*E*Math.sin(Mp+M)
    +0.00208*E*E*Math.sin(2*M)+tail;
}

// Meeus 49.3: quarter-phase correction, applied on top of the same base J/E/M/Mp/F as ph().
// q=0.25 (first quarter) adds W, q=0.75 (last quarter) subtracts it.
function phQuarter(k, q) {
  var T=k/1236.85;
  var J=2451550.09766+29.530588861*(k+q)+0.00015437*T*T;
  var E=1-0.002516*T-0.0000074*T*T, kk=k+q;
  var M=(2.5534+29.10535670*kk)*R, Mp=(201.5643+385.81693528*kk)*R, F=(160.7108+390.67050284*kk)*R;
  var c = -0.62801*Math.sin(Mp) + 0.17172*E*Math.sin(M) - 0.01183*E*Math.sin(Mp+M)
      + 0.00862*Math.sin(2*Mp) + 0.00804*Math.sin(2*F) + 0.00454*E*Math.sin(Mp-M)
      + 0.00204*E*E*Math.sin(2*M) - 0.00180*Math.sin(Mp-2*F) - 0.00070*Math.sin(Mp+2*F);
  var W = 0.00306 - 0.00038*E*Math.cos(M) + 0.00026*Math.cos(Mp);
  return q === 0.25 ? J + c + W : J + c - W;
}

// Largest k where ph(k, 0.5) <= t
function fullMoonK(t) {
  var k = Math.floor((t - 2451550.09766) / SM);
  while (ph(k, 0.5) <= t) k++;
  return k - 1;
}

// The lunar ring's marks sit at fixed 0/25/50/75% (the phases ARE quarters,
// exact elongations). The pointer interpolates linearly between whichever
// pair of true instants t falls between, so its speed varies the way the
// moon's orbital speed actually varies, instead of sweeping uniformly.
function lunarPointerFraction(t) {
  var k = fullMoonK(t);
  var t0 = ph(k, 0.5);
  var t1 = phQuarter(k, 0.75);
  var t2 = ph(k + 1, 0.0);
  var t3 = phQuarter(k + 1, 0.25);
  var t4 = ph(k + 1, 0.5);
  if (t < t1) return (t - t0) / (t1 - t0) * 0.25;
  if (t < t2) return 0.25 + (t - t1) / (t2 - t1) * 0.25;
  if (t < t3) return 0.5 + (t - t2) / (t3 - t2) * 0.25;
  return 0.75 + (t - t3) / (t4 - t3) * 0.25;
}

// Standard low-precision solar position (Meeus ch.25): mean longitude L0,
// mean anomaly M, equation of centre C. True longitude = L0 + C.
function sunLongitude(jde) {
  var T = (jde - 2451545.0) / 36525;
  var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  var M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  var Mr = M * R;
  var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mr)
    + (0.019993 - 0.000101 * T) * Math.sin(2 * Mr)
    + 0.000289 * Math.sin(3 * Mr);
  var trueLong = L0 + C;
  return ((trueLong % 360) + 360) % 360;
}

// The solar ring IS longitude: no interpolation needed, exact everywhere.
// 270 deg is the winter solstice, the ring's 0% mark.
function solarPointerFraction(t) {
  var lambda = sunLongitude(t);
  return (((lambda - 270) % 360 + 360) % 360) / 360;
}

// Copied verbatim from files/calendar-mechanism.html
function decSol(y){var Y=(y-2000)/1000;return 2451900.05952+365242.74049*Y-0.06223*Y*Y-0.00823*Y*Y*Y+0.00032*Y*Y*Y*Y;}
function marEq(y){var Y=(y-2000)/1000;return 2451623.80984+365242.37404*Y+0.05169*Y*Y-0.00411*Y*Y*Y-0.00057*Y*Y*Y*Y;}
function junSol(y){var Y=(y-2000)/1000;return 2451716.56767+365241.62603*Y+0.00325*Y*Y+0.00888*Y*Y*Y-0.00030*Y*Y*Y*Y;}
function sepEq(y){var Y=(y-2000)/1000;return 2451810.21715+365242.01767*Y-0.11575*Y*Y+0.00337*Y*Y*Y+0.00078*Y*Y*Y*Y;}

// Calendar year of the December solstice at or before t
function solsticeYear(t) {
  var g = new Date((t - 2440587.5) * 86400000).getUTCFullYear();
  return t >= decSol(g) ? g : g - 1;
}

function buildTicks(groupId, radius, count, majorEvery, topColor, tickColor, maxLen) {
  var group = document.getElementById(groupId);
  var lenMajor = maxLen ? Math.min(radius * 0.3, maxLen) : radius * 0.3;
  var lenMinor = lenMajor * 0.7;
  var edge = cy - radius;
  var inner = edge + lenMajor;
  var outerShort = edge + (lenMajor - lenMinor);
  var step = 360 / count;

  for (var i = 0; i < count; i++) {
    var isMajor = i % majorEvery === 0;
    var tick = document.createElementNS(svgNS, "line");
    tick.setAttribute("x1", cx);
    tick.setAttribute("y1", isMajor ? edge : outerShort);
    tick.setAttribute("x2", cx);
    tick.setAttribute("y2", inner);
    tick.setAttribute("stroke", i === 0 ? topColor : tickColor);
    tick.setAttribute("stroke-width", isMajor ? "4" : "2");
    tick.setAttribute("transform", "rotate(" + (i * step) + ")");
    group.appendChild(tick);
  }
}

function buildPhaseTicks(groupId, radius, fractions, topColor, tickColor, maxLen) {
  var group = document.getElementById(groupId);
  var lenMajor = maxLen ? Math.min(radius * 0.3, maxLen) : radius * 0.3;
  var edge = cy - radius;
  var inner = edge + lenMajor;

  fractions.forEach(function(f, i) {
    var tick = document.createElementNS(svgNS, "line");
    tick.setAttribute("x1", cx);
    tick.setAttribute("y1", edge);
    tick.setAttribute("x2", cx);
    tick.setAttribute("y2", inner);
    tick.setAttribute("stroke", i === 0 ? topColor : tickColor);
    tick.setAttribute("stroke-width", "4");
    tick.setAttribute("transform", "rotate(" + (f * 360) + ")");
    group.appendChild(tick);
  });
}

// Small moon-phase glyph: full = filled disc, new = outline only,
// first/last quarter = half-lit disc (right/left, matching real orientation).
function moonIcon(x, y, r, phase) {
  var g = document.createElementNS(svgNS, "g");
  var disc = document.createElementNS(svgNS, "circle");
  disc.setAttribute("cx", x);
  disc.setAttribute("cy", y);
  disc.setAttribute("r", r);
  disc.setAttribute("fill", phase === "full" ? "white" : "none");
  disc.setAttribute("stroke", "white");
  disc.setAttribute("stroke-width", "2");
  g.appendChild(disc);

  if (phase === "first" || phase === "last") {
    var sweep = phase === "first" ? 1 : 0;
    var half = document.createElementNS(svgNS, "path");
    half.setAttribute("d", "M " + x + " " + (y - r) + " A " + r + " " + r + " 0 0 " + sweep + " " + x + " " + (y + r) + " Z");
    half.setAttribute("fill", "white");
    g.appendChild(half);
  }

  return g;
}

function buildMoonPhaseMarks(groupId, radius, iconR) {
  var group = document.getElementById(groupId);
  group.appendChild(moonIcon(0, -radius, iconR, "full"));
  group.appendChild(moonIcon(radius, 0, iconR, "last"));
  group.appendChild(moonIcon(0, radius, iconR, "new"));
  group.appendChild(moonIcon(-radius, 0, iconR, "first"));
}

buildTicks("ticks-hours", 200, 24, 6, "white", "grey", 37.5);
buildTicks("ticks-clock", 150, 60, 5, "white", "grey", 37.5);

var initJD = Date.now() / 86400000 + 2440587.5;
var initK = fullMoonK(initJD);
var initThisFM = ph(initK, 0.5);
var initNextFM = ph(initK + 1, 0.5);
var initMonthLen = initNextFM - initThisFM;

var lastQuarterJDE = phQuarter(initK, 0.75);
var newMoonJDE = ph(initK + 1, 0.0);
var firstQuarterJDE = phQuarter(initK + 1, 0.25);

buildMoonPhaseMarks("ticks-lunar", 228, 14);

function jdeToISO(j) {
  return new Date((j - 2440587.5) * 86400000).toISOString();
}
console.log("Full moon (opens month, 0%):", jdeToISO(initThisFM));
console.log("Last quarter (25%):", jdeToISO(lastQuarterJDE));
console.log("New moon (50%):", jdeToISO(newMoonJDE));
console.log("First quarter (75%):", jdeToISO(firstQuarterJDE));
console.log("Full moon (closes month, 100%):", jdeToISO(initNextFM));

var initSolY = solsticeYear(initJD);
var initThisSol = decSol(initSolY);
var initNextSol = decSol(initSolY + 1);
var initMarEq = marEq(initSolY + 1);
var initJunSol = junSol(initSolY + 1);
var initSepEq = sepEq(initSolY + 1);
var initYearLen = initNextSol - initThisSol;

var fMarEq = (initMarEq - initThisSol) / initYearLen;
var fJunSol = (initJunSol - initThisSol) / initYearLen;
var fSepEq = (initSepEq - initThisSol) / initYearLen;

buildPhaseTicks("ticks-solar", 300, [0, 0.25, 0.5, 0.75], "white", "grey", 37.5);

var winterDeg = fMarEq * 360;
var springDeg = (fJunSol - fMarEq) * 360;
var summerDeg = (fSepEq - fJunSol) * 360;
var autumnDeg = (1 - fSepEq) * 360;
console.log("Winter season:", winterDeg.toFixed(1) + "°");
console.log("Spring season:", springDeg.toFixed(1) + "°");
console.log("Summer season:", summerDeg.toFixed(1) + "°");
console.log("Autumn season:", autumnDeg.toFixed(1) + "°");

console.log("Current lunar pointer fraction:", lunarPointerFraction(initJD).toFixed(4));
console.log("Current solar pointer fraction:", solarPointerFraction(initJD).toFixed(4));

var handHours = document.getElementById("hand-hours");
var handLunar = document.getElementById("hand-lunar");
var handSolar = document.getElementById("hand-solar");
var handClockHour = document.getElementById("hand-clock-hour");
var handClockMinute = document.getElementById("hand-clock-minute");
var handClockSecond = document.getElementById("hand-clock-second");

function tick() {
  var now = new Date();
  var secFraction = (now.getSeconds() + now.getMilliseconds() / 1000) / 60;
  var minFraction = (now.getMinutes() + secFraction) / 60;
  var hourFraction = (now.getHours() + minFraction) / 24;
  handHours.setAttribute("transform", "rotate(" + (hourFraction * 360) + ")");

  var clockHourFraction = ((now.getHours() % 12) + minFraction) / 12;
  handClockHour.setAttribute("transform", "rotate(" + (clockHourFraction * 360) + ")");
  handClockMinute.setAttribute("transform", "rotate(" + (minFraction * 360) + ")");
  handClockSecond.setAttribute("transform", "rotate(" + (secFraction * 360) + ")");

  var jd = Date.now() / 86400000 + 2440587.5;
  var lunarFraction = lunarPointerFraction(jd);
  handLunar.setAttribute("transform", "rotate(" + (lunarFraction * 360) + ")");

  var solarFraction = solarPointerFraction(jd);
  handSolar.setAttribute("transform", "rotate(" + (solarFraction * 360) + ")");

  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
</script>
</body>
</html>
