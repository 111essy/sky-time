<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
  background: black;
}
</style>
</head>
<body>
<svg viewBox="0 0 800 800" style="max-width: 340px;">
<circle cx="400" cy="400" r="75" fill="none" stroke="grey" stroke-width="2" />
<circle cx="400" cy="400" r="125" fill="none" stroke="grey" stroke-width="2" />
<g id="ticks-seconds"></g>
<g id="ticks-minutes"></g>
<g id="hand-minutes">
<line x1="400" y1="325" x2="400" y2="287" stroke="crimson" stroke-width="6" stroke-linecap="round" />
</g>
<g id="hand-seconds">
<line x1="400" y1="400" x2="400" y2="337" stroke="crimson" stroke-width="6" stroke-linecap="round" />
<circle cx="400" cy="400" r="12" fill="crimson" />
</g>
</svg>
<script>
var svgNS = "http://www.w3.org/2000/svg";
var cx = 400, cy = 400;

function buildTicks(groupId, radius, topColor, tickColor) {
  var group = document.getElementById(groupId);
  var lenFive = radius * 0.3;
  var lenOther = lenFive * 0.7;
  var edge = cy - radius;
  var inner = edge + lenFive;
  var outerShort = edge + (lenFive - lenOther);

  for (var i = 0; i < 60; i++) {
    var isFive = i % 5 === 0;
    var tick = document.createElementNS(svgNS, "line");
    tick.setAttribute("x1", cx);
    tick.setAttribute("y1", isFive ? edge : outerShort);
    tick.setAttribute("x2", cx);
    tick.setAttribute("y2", inner);
    tick.setAttribute("stroke", i === 0 ? topColor : tickColor);
    tick.setAttribute("stroke-width", isFive ? "4" : "2");
    tick.setAttribute("transform", "rotate(" + (i * 6) + " " + cx + " " + cy + ")");
    group.appendChild(tick);
  }
}

buildTicks("ticks-seconds", 75, "orange", "grey");
buildTicks("ticks-minutes", 125, "orange", "grey");

var handSeconds = document.getElementById("hand-seconds");
var handMinutes = document.getElementById("hand-minutes");

function tick() {
  var now = new Date();
  var secFraction = (now.getSeconds() + now.getMilliseconds() / 1000) / 60;
  var minFraction = (now.getMinutes() + secFraction) / 60;
  handSeconds.setAttribute("transform", "rotate(" + (secFraction * 360) + " " + cx + " " + cy + ")");
  handMinutes.setAttribute("transform", "rotate(" + (minFraction * 360) + " " + cx + " " + cy + ")");
  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
</script>
</body>
</html>
