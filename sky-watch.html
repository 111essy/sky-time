<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
  background: black;
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
svg {
  display: block;
  width: 90vmin;
  height: 90vmin;
}
#location-info {
  color: grey;
  font-family: sans-serif;
  font-size: 24px;
  margin-top: 8px;
  text-align: center;
}
#location-choice {
  display: none;
  margin-top: 8px;
  text-align: center;
}
#location-choice button {
  background: none;
  border: 1px solid grey;
  color: #eee;
  font-family: sans-serif;
  font-size: 24px;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  margin: 0 4px;
}
#location-choice button:hover {
  background: #222;
}
#city-search-container {
  display: none;
  margin-top: 8px;
  text-align: center;
}
#city-search-input {
  background: #111;
  color: #eee;
  border: 1px solid grey;
  border-radius: 4px;
  padding: 4px 8px;
  font-family: sans-serif;
  font-size: 24px;
  width: 220px;
}
#city-search-results {
  list-style: none;
  margin: 4px auto 0;
  padding: 0;
  max-width: 260px;
  max-height: 160px;
  overflow-y: auto;
}
#city-search-results li {
  color: #ccc;
  font-family: sans-serif;
  font-size: 24px;
  padding: 4px 8px;
  cursor: pointer;
  text-align: left;
}
#city-search-results li:hover {
  background: #222;
}
#clear-location-btn {
  display: none;
  margin-top: 8px;
  background: none;
  border: 1px solid grey;
  color: grey;
  font-family: sans-serif;
  font-size: 24px;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
}
</style>
</head>
<body>
<svg viewBox="-320 -320 640 640">
<circle cx="0" cy="0" r="200" fill="none" stroke="white" stroke-width="3" />
<circle cx="0" cy="0" r="250" fill="none" stroke="white" stroke-width="3" />
<circle cx="0" cy="0" r="300" fill="none" stroke="white" stroke-width="3" />
<circle cx="0" cy="0" r="150" fill="none" stroke="white" stroke-width="3" />
<g id="twilight-bands"></g>
<g id="sun-events">
<g id="mark-solar-midnight">
<line x1="0" y1="-200" x2="0" y2="-162.5" stroke="blue" stroke-width="4" />
</g>
<g id="mark-solar-noon">
<line x1="0" y1="-200" x2="0" y2="-162.5" stroke="deepskyblue" stroke-width="4" />
</g>
<g id="mark-sunrise"></g>
<g id="mark-sunset"></g>
</g>
<g id="ticks-hours"></g>
<g id="ticks-lunar"></g>
<g id="ticks-solar"></g>
<g id="ticks-clock"></g>
<!-- Background labels for clock face -->
<text x="0" y="-35" text-anchor="middle" font-family="sans-serif" font-size="28" fill="white" opacity="1">civil time</text>
<text x="0" y="55" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#ffb300" opacity="1">solar time</text>
<!-- These outer-ring hands are kept last so they always render above every ring, tick and mark.
     hand-hours (day ring) is amber and synced to solar time; the other two stay crimson.
     Both the day ring and the central clock's amber hands (hand-solar-mean-
     hour/minute, below) now run zone MEAN solar time off the same
     zoneMeanMinutesOfDay quantity (see tick()) — one oscillating system,
     no equation of time anywhere — so they share the same amber, not a
     distinguishing shade. -->
<g id="hand-solar">
<line x1="0" y1="-255" x2="0" y2="-295.5" stroke="crimson" stroke-width="6" stroke-linecap="round" />
</g>
<g id="hand-lunar">
<line x1="0" y1="-205" x2="0" y2="-245.5" stroke="crimson" stroke-width="6" stroke-linecap="round" />
</g>
<g id="hand-hours">
<line x1="0" y1="-155" x2="0" y2="-195.5" stroke="#ffb300" stroke-width="6" stroke-linecap="round" />
</g>
<!-- Clock-face stack, back to front: hour+minute hands, then the amber
     mean solar-time hands above them, then the second hand and hub on top. -->
<g id="hand-clock-hour">
<line x1="0" y1="0" x2="0" y2="-70" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.8" />
</g>
<g id="hand-clock-minute">
<line x1="0" y1="0" x2="0" y2="-110" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.8" />
</g>
<g id="hand-solar-mean-hour">
<line x1="0" y1="0" x2="0" y2="-63" stroke="#ffb300" stroke-width="7.2" stroke-linecap="round" opacity="0.8" />
</g>
<g id="hand-solar-mean-minute">
<line x1="0" y1="0" x2="0" y2="-99" stroke="#ffb300" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
</g>
<g id="hand-clock-second">
<line x1="0" y1="0" x2="0" y2="-130" stroke="red" stroke-width="2" stroke-linecap="round" />
</g>
<circle cx="0" cy="0" r="7" fill="white" />
</svg>
<div id="location-info"></div>
<div id="location-choice">
<button id="choice-auto-btn" type="button">Use my location</button>
<button id="choice-manual-btn" type="button">Enter city manually</button>
</div>
<div id="city-search-container">
<input id="city-search-input" type="text" placeholder="Search for your city…" autocomplete="off" />
<ul id="city-search-results"></ul>
</div>
<button id="clear-location-btn" type="button">Change location</button>
<script>
var svgNS = "http://www.w3.org/2000/svg";
var cx = 0, cy = 0;

var ROTTERDAM_LAT = 51.9225;
var ROTTERDAM_LON = 4.47917;
var SKY_ZONE_STEP_MINUTES = 30; // 7.5 degrees of longitude

// Sky-time zone offset from UTC, in minutes: the nearest multiple of
// SKY_ZONE_STEP_MINUTES to the location's true mean solar offset (4
// minutes per degree east). 48 zones worldwide, +00:00 at Greenwich.
function skyZoneOffsetMinutes(lonDegEast) {
  var trueOffset = lonDegEast * 4;
  var z = Math.round(trueOffset / SKY_ZONE_STEP_MINUTES) * SKY_ZONE_STEP_MINUTES;
  if (z === -720) z = 720; // dateline: normalise to +12:00
  return z;
}

// Copied verbatim from files/calendar-mechanism.html (there named ph, not phJDE)
var R = Math.PI / 180;
var SM = 29.530589;
function ph(k,q){ // JDE of lunar phase: q=0 new, 0.5 full (Meeus ch.49, full 16-term series)
  var T=k/1236.85;
  var J=2451550.09766+29.530588861*(k+q)+0.00015437*T*T;
  var E=1-0.002516*T-0.0000074*T*T, kk=k+q;
  var M=(2.5534+29.10535670*kk)*R, Mp=(201.5643+385.81693528*kk)*R, F=(160.7108+390.67050284*kk)*R;
  var Om=(124.7746-1.56375588*k)*R;
  var tail = -0.00111*Math.sin(Mp-2*F) - 0.00057*Math.sin(Mp+2*F) + 0.00056*E*Math.sin(2*Mp+M)
    - 0.00042*Math.sin(3*Mp) + 0.00042*E*Math.sin(M+2*F) + 0.00038*E*Math.sin(M-2*F)
    - 0.00024*E*Math.sin(2*Mp-M) - 0.00017*Math.sin(Om) - 0.00007*Math.sin(Mp+2*M);
  if(q===0.5){
    return J-0.40614*Math.sin(Mp)+0.17302*E*Math.sin(M)+0.01614*Math.sin(2*Mp)
      +0.01043*Math.sin(2*F)+0.00734*E*Math.sin(Mp-M)-0.00514*E*Math.sin(Mp+M)
      +0.00209*E*E*Math.sin(2*M)+tail;
  }
  return J-0.40720*Math.sin(Mp)+0.17241*E*Math.sin(M)+0.01608*Math.sin(2*Mp)
    +0.01039*Math.sin(2*F)+0.00739*E*Math.sin(Mp-M)-0.00514*E*Math.sin(Mp+M)
    +0.00208*E*E*Math.sin(2*M)+tail;
}

// Meeus 49.3: quarter-phase correction, applied on top of the same base J/E/M/Mp/F as ph().
// q=0.25 (first quarter) adds W, q=0.75 (last quarter) subtracts it.
function phQuarter(k, q) {
  var T=k/1236.85;
  var J=2451550.09766+29.530588861*(k+q)+0.00015437*T*T;
  var E=1-0.002516*T-0.0000074*T*T, kk=k+q;
  var M=(2.5534+29.10535670*kk)*R, Mp=(201.5643+385.81693528*kk)*R, F=(160.7108+390.67050284*kk)*R;
  var c = -0.62801*Math.sin(Mp) + 0.17172*E*Math.sin(M) - 0.01183*E*Math.sin(Mp+M)
      + 0.00862*Math.sin(2*Mp) + 0.00804*Math.sin(2*F) + 0.00454*E*Math.sin(Mp-M)
      + 0.00204*E*E*Math.sin(2*M) - 0.00180*Math.sin(Mp-2*F) - 0.00070*Math.sin(Mp+2*F);
  var W = 0.00306 - 0.00038*E*Math.cos(M) + 0.00026*Math.cos(Mp);
  return q === 0.25 ? J + c + W : J + c - W;
}

// Largest k where ph(k, 0.5) <= t
function fullMoonK(t) {
  var k = Math.floor((t - 2451550.09766) / SM);
  while (ph(k, 0.5) <= t) k++;
  return k - 1;
}

// Meeus ch.47: Moon's geocentric ecliptic longitude, mean longitude L'
// plus the leading periodic terms of table 47.A. Five of these terms
// (sin(M), sin(2D-M-M'), sin(2D-M), sin(M-M'), sin(M+M')) carry an E
// eccentricity factor in the table; it's omitted here as negligible
// (E is about 0.99933, so dropping it costs ~0.00015 deg), not because
// these terms are E-independent.
//
// The five angle arguments below (L', D, M, M', F) also drop their T^2
// secular terms, unlike ph()/phQuarter(), which keep theirs. That costs
// ~0.00004 deg in 2026, ~0.0003 deg by 2100, ~0.022 deg by 2500, and
// ~0.20 deg by 3000 — the ring drifts slowly over millennia even though
// the calendar's phase dates (from ph()/phQuarter()) do not.
function moonLongitude(jde) {
  var T = (jde - 2451545.0) / 36525;
  var Lp = 218.3164477 + 481267.88123421 * T;
  var D = 297.8501921 + 445267.1114034 * T;
  var M = 357.5291092 + 35999.0502909 * T;
  var Mp = 134.9633964 + 477198.8675055 * T;
  var F = 93.2720950 + 483202.0175233 * T;

  var Dr = D * R, Mr = M * R, Mpr = Mp * R, Fr = F * R;

  var sum = 6.288774 * Math.sin(Mpr)
    + 1.274027 * Math.sin(2 * Dr - Mpr)
    + 0.658314 * Math.sin(2 * Dr)
    + 0.213618 * Math.sin(2 * Mpr)
    - 0.185116 * Math.sin(Mr)
    - 0.114332 * Math.sin(2 * Fr)
    + 0.058793 * Math.sin(2 * Dr - 2 * Mpr)
    + 0.057066 * Math.sin(2 * Dr - Mr - Mpr)
    + 0.053322 * Math.sin(2 * Dr + Mpr)
    + 0.045758 * Math.sin(2 * Dr - Mr)
    - 0.040923 * Math.sin(Mr - Mpr)
    - 0.034720 * Math.sin(Dr)
    - 0.030383 * Math.sin(Mr + Mpr)
    + 0.015327 * Math.sin(2 * Dr - 2 * Fr)
    - 0.012528 * Math.sin(Mpr + 2 * Fr)
    + 0.010980 * Math.sin(Mpr - 2 * Fr)
    + 0.010675 * Math.sin(4 * Dr - Mpr)
    + 0.010034 * Math.sin(3 * Mpr)
    + 0.008548 * Math.sin(4 * Dr - 2 * Mpr);

  return ((Lp + sum) % 360 + 360) % 360;
}

// The lunar ring's marks sit at fixed 0/25/50/75% (the phases ARE quarters,
// exact elongations). The ring IS elongation D = moonLongitude - sunLongitude,
// anchored so full moon (D=180) sits at 0%: no interpolation, exact everywhere.
function lunarPointerFraction(t) {
  var elong = moonLongitude(t) - sunLongitude(t);
  return (((elong - 180) % 360 + 360) % 360) / 360;
}

// Meeus 22.2: mean obliquity of the ecliptic (degrees).
function obliquity(jde) {
  var T = (jde - 2451545.0) / 36525;
  return 23.439291 - 0.0130042 * T - 0.00000016 * T * T + 0.000000504 * T * T * T;
}

// Wrap a degree value into -180..+180.
function wrapTo180(deg) {
  return ((deg % 360) + 540) % 360 - 180;
}

// Standard low-precision solar position (Meeus ch.25): mean longitude L0,
// mean anomaly M, equation of centre C, then corrected for aberration and
// nutation to get APPARENT longitude — the quantity the equinoxes and
// solstices are actually defined against (worth ~0.0033 deg, ~5 min of time).
// Tilting lambda by the obliquity (Meeus 22) gives declination and right
// ascension; those plus L0 give the equation of time, all needed for
// sunrise/sunset.
function solarPosition(jde) {
  var T = (jde - 2451545.0) / 36525;
  var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  var M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  var Mr = M * R;
  var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mr)
    + (0.019993 - 0.000101 * T) * Math.sin(2 * Mr)
    + 0.000289 * Math.sin(3 * Mr);
  var trueLong = L0 + C;
  var Omega = 125.04 - 1934.136 * T;
  var lambda = trueLong - 0.00569 - 0.00478 * Math.sin(Omega * R);
  lambda = ((lambda % 360) + 360) % 360;

  var eps = obliquity(jde);
  var epsR = eps * R;
  var lambdaR = lambda * R;

  var declination = Math.asin(Math.sin(epsR) * Math.sin(lambdaR)) / R;
  var rightAscension = Math.atan2(Math.cos(epsR) * Math.sin(lambdaR), Math.cos(lambdaR)) / R;
  rightAscension = ((rightAscension % 360) + 360) % 360;

  var eot = 4 * wrapTo180(L0 - 0.0057183 - rightAscension);

  return {
    lambda: lambda,
    epsilon: eps,
    declination: declination,
    rightAscension: rightAscension,
    eot: eot,
    L0: L0
  };
}

// Thin wrapper kept so solarPointerFraction/solarLongitudeCrossing don't change.
function sunLongitude(jde) {
  return solarPosition(jde).lambda;
}

// The solar ring IS longitude: no interpolation needed, exact everywhere.
// 270 deg is the winter solstice, the ring's 0% mark.
function solarPointerFraction(t) {
  var lambda = sunLongitude(t);
  return (((lambda - 270) % 360 + 360) % 360) / 360;
}

// JD for a UTC calendar date, used only to seed the Newton solve below —
// needs to be within half a year of the true crossing, nothing more.
function seedJD(y, month, day) {
  return Date.UTC(y, month - 1, day) / 86400000 + 2440587.5;
}

// The single source of truth for solstices/equinoxes: the instant the sun's
// apparent longitude equals targetDeg. Newton iteration using the sun's mean
// rate (~0.9856 deg/day); the angular error is wrapped into -180..+180 each
// step so it always steps toward the nearest crossing. Converges in 3-4
// iterations; the loop runs a couple extra for margin.
function solarLongitudeCrossing(targetDeg, guessJD) {
  var jd = guessJD;
  for (var i = 0; i < 8; i++) {
    var delta = ((targetDeg - sunLongitude(jd) + 180) % 360 + 360) % 360 - 180;
    var step = delta / 0.9856;
    jd += step;
    if (Math.abs(step) < 1 / 86400) break; // under a second
  }
  return jd;
}

// Sunrise, solar noon and sunset for a given day (jde, at or near 0h UT)
// and location, all as minutes from UTC midnight. Standard sunrise equation
// using the hour angle of the sun at altitude h0 (default -0.833 deg,
// accounting for the sun's apparent radius and average atmospheric
// refraction — the conventional sunrise/sunset threshold). Passing a more
// negative h0 (-6/-12/-18) gives the same "sunrise/sunset" pair for civil,
// nautical or astronomical twilight instead. Returns null sunrise/sunset
// when |cosH| > 1 — the sun never crosses that altitude that day (polar
// day or polar night relative to this threshold) — rather than throwing on
// the domain error acos() would raise.
function sunEvents(jde, latDeg, lonDegEast, h0) {
  if (h0 === undefined) h0 = -0.833;
  var pos = solarPosition(jde);
  var latR = latDeg * R;
  var decR = pos.declination * R;
  var cosH = (Math.sin(h0 * R) - Math.sin(latR) * Math.sin(decR)) / (Math.cos(latR) * Math.cos(decR));
  var noon = 720 - 4 * lonDegEast - pos.eot;

  if (Math.abs(cosH) > 1) {
    return { sunrise: null, sunset: null, noon: noon };
  }

  var H = Math.acos(cosH) / R;
  return { sunrise: noon - 4 * H, sunset: noon + 4 * H, noon: noon };
}

// The half-day angle H (degrees): the hour angle from transit to the
// moment the sun crosses altitude h0Deg, at latitude latDeg on the day
// containing jde. A pure function of the instant and latitude — no cached
// state, no lookup tables, no epoch counters — so it stays correct
// recomputed fresh every frame, left running for 100 years. Returns null
// when |cosH| > 1 (the sun never crosses h0Deg that day at this latitude).
//
// This is what the day ring's marks are built from (see
// buildTwilightSegments/updateSunMarks below): unlike sunEvents above,
// which locates a real event in UTC at an exact longitude (with the
// equation of time), halfDayAngle only ever answers "how many degrees from
// noon" — deliberately longitude- and EoT-free, since the ring runs a
// fixed-noon zone-mean-time model, not true solar time. sunEvents is kept
// unchanged and still used wherever this file wants the real, exact event
// (the astronomy fixtures, and the true-vs-ring comparison in the
// verification block below) — two functions computing genuinely different
// things, not two sources of truth for the same one.
function halfDayAngle(jde, latDeg, h0Deg) {
  var pos = solarPosition(jde);
  var latR = latDeg * R;
  var decR = pos.declination * R;
  var cosH = (Math.sin(h0Deg * R) - Math.sin(latR) * Math.sin(decR)) / (Math.cos(latR) * Math.cos(decR));
  if (Math.abs(cosH) > 1) return null;
  return Math.acos(cosH) / R;
}

// The four altitude thresholds this file draws twilight bands for, ordered
// from brightest (day/night boundary) to darkest (astronomical). Shared by
// computeDayEvents (below), the twilight-band builder, and the verification
// blocks at the bottom, so all three always agree on what "civil" etc. mean.
var TWILIGHT_H0 = [-0.833, -6, -12, -18];
var TWILIGHT_COLORS = ["#9FCFF5", "#5B8FD4", "#33578F", "#1E2F52", "#131C33"]; // day, civil, nautical, astronomical, night

// --- Klima: Ptolemy's latitude bands, defined by longest-day length. ---
//
// Equal-degree latitude bands would be wrong: a degree of latitude is
// negligible near the equator and dominant near the poles (the same
// nonlinearity sunEvents' cosH already deals with). Quantising the OUTPUT
// (longest day, in KLIMA_STEP_HOURS steps — the same step as the
// SKY_ZONE_STEP_MINUTES longitude zones) instead gives uniform error and
// bands that narrow automatically where the sky actually changes fastest.
// 24 bands per hemisphere, 48 worldwide — this is what astrolabe plates
// were historically cut for.

var KLIMA_STEP_HOURS = 0.5; // 30 minutes
var KLIMA_MAX_LAT = 66.8; // just past the polar circle, where the scale saturates
var SOLSTICE_DECLINATION = 23.44; // fixed, not solarPosition()'s slowly-drifting obliquity — klima is a latitude-only ideal, not tied to a date

// Longest day, in hours, at latitude latDeg — the summer solstice's day
// length, using the same h0 = -0.833 threshold as sunEvents. Only the
// magnitude of latDeg matters (day length is symmetric between
// hemispheres; klimaLatitude, below, reapplies the sign). Returns 24 at and
// above the polar circle, where the sun never sets at the solstice.
function longestDayHours(latDeg) {
  var latR = Math.abs(latDeg) * R;
  var decR = SOLSTICE_DECLINATION * R;
  var cosH = (Math.sin(-0.833 * R) - Math.sin(latR) * Math.sin(decR)) / (Math.cos(latR) * Math.cos(decR));
  if (cosH <= -1) return 24; // polar day at the solstice: the sun never sets
  if (cosH >= 1) return 0; // never reached for latitudes below the polar circle, guarded anyway
  var H = Math.acos(cosH) / R;
  return 2 * H / 15;
}

// The klima band a latitude falls in: its longest day, rounded to the
// nearest KLIMA_STEP_HOURS (30 minutes).
function klimaHours(latDeg) {
  return Math.round(longestDayHours(latDeg) / KLIMA_STEP_HOURS) * KLIMA_STEP_HOURS;
}

// True above the polar circle: the klima scale has saturated (longest day
// >= 24h) and there is no band to represent this latitude with.
function isPolarLatitude(latDeg) {
  return longestDayHours(latDeg) >= 23.99;
}

// The band's representative latitude: invert longestDayHours by bisection
// (it's monotonically increasing in |lat|, so bisection is safe) to find
// the latitude whose OWN longest day equals this one's rounded klima band,
// then reapply the sign of the input. This is the latitude the machine
// actually uses for every sunEvents/computeDayEvents call — two locations
// in the same band see an identical clock. Returns null in the polar case
// (see isPolarLatitude) rather than clamping to the polar circle, since a
// clamped value would silently misrepresent a real polar latitude as a
// mundane 66.5-degree one.
function klimaLatitude(latDeg) {
  if (isPolarLatitude(latDeg)) return null;
  var target = klimaHours(latDeg);
  var lo = 0, hi = KLIMA_MAX_LAT;
  for (var i = 0; i < 50; i++) {
    var mid = (lo + hi) / 2;
    if (longestDayHours(mid) < target) lo = mid; else hi = mid;
  }
  var representative = (lo + hi) / 2;
  return latDeg < 0 ? -representative : representative;
}

// "16h30m" / "12h00m" / "21h00m" — klimaHours() is always a multiple of
// KLIMA_STEP_HOURS by construction, so rounding to the nearest minute here
// is just float cleanup, not a second quantisation.
function formatKlimaHours(hours) {
  var totalMinutes = Math.round(hours * 60);
  var hh = Math.floor(totalMinutes / 60);
  var mm = totalMinutes % 60;
  return hh + "h" + (mm < 10 ? "0" : "") + mm + "m";
}

// Calendar year of the December solstice (longitude 270) at or before t
function solsticeYear(t) {
  var g = new Date((t - 2440587.5) * 86400000).getUTCFullYear();
  var thisDecSol = solarLongitudeCrossing(270, seedJD(g, 12, 21));
  return t >= thisDecSol ? g : g - 1;
}

function buildTicks(groupId, radius, count, majorEvery, topColor, tickColor, maxLen) {
  var group = document.getElementById(groupId);
  var lenMajor = maxLen ? Math.min(radius * 0.3, maxLen) : radius * 0.3;
  var lenMinor = lenMajor * 0.7;
  var edge = cy - radius;
  var inner = edge + lenMajor;
  var outerShort = edge + (lenMajor - lenMinor);
  var step = 360 / count;

  for (var i = 0; i < count; i++) {
    var isMajor = i % majorEvery === 0;
    var tick = document.createElementNS(svgNS, "line");
    tick.setAttribute("x1", cx);
    tick.setAttribute("y1", isMajor ? edge : outerShort);
    tick.setAttribute("x2", cx);
    tick.setAttribute("y2", inner);
    tick.setAttribute("stroke", i === 0 ? topColor : tickColor);
    tick.setAttribute("stroke-width", isMajor ? "4" : "2");
    tick.setAttribute("transform", "rotate(" + (i * step) + ")");
    group.appendChild(tick);
  }
}

// Small phase glyph: "full" = filled disc, "ring"/"new" = outline only,
// "first"/"last" = half-lit disc split on the vertical (right/left),
// "half-top"/"half-bottom" = half-lit disc split on the horizontal.
function phaseGlyph(x, y, r, phase, color) {
  var g = document.createElementNS(svgNS, "g");
  var disc = document.createElementNS(svgNS, "circle");
  disc.setAttribute("cx", x);
  disc.setAttribute("cy", y);
  disc.setAttribute("r", r);
  disc.setAttribute("fill", phase === "full" ? color : "none");
  disc.setAttribute("stroke", color);
  disc.setAttribute("stroke-width", "2");
  g.appendChild(disc);

  var halves = {
    first: [x, y - r, x, y + r, 1],       // right half
    last: [x, y - r, x, y + r, 0],        // left half
    "half-top": [x - r, y, x + r, y, 1],  // top half
    "half-bottom": [x - r, y, x + r, y, 0] // bottom half
  };
  var h = halves[phase];
  if (h) {
    var half = document.createElementNS(svgNS, "path");
    half.setAttribute("d", "M " + h[0] + " " + h[1] + " A " + r + " " + r + " 0 0 " + h[4] + " " + h[2] + " " + h[3] + " Z");
    half.setAttribute("fill", color);
    g.appendChild(half);
  }

  return g;
}

function buildMoonPhaseMarks(groupId, radius, iconR) {
  var group = document.getElementById(groupId);
  group.appendChild(phaseGlyph(0, -radius, iconR, "full", "white"));
  group.appendChild(phaseGlyph(radius, 0, iconR, "last", "white"));
  group.appendChild(phaseGlyph(0, radius, iconR, "new", "white"));
  group.appendChild(phaseGlyph(-radius, 0, iconR, "first", "white"));
}

function buildSunPhaseMarks(groupId, radius, iconR) {
  var group = document.getElementById(groupId);
  group.appendChild(phaseGlyph(0, -radius, iconR, "ring", "yellow"));
  group.appendChild(phaseGlyph(radius, 0, iconR, "half-top", "yellow"));
  group.appendChild(phaseGlyph(0, radius, iconR, "full", "yellow"));
  group.appendChild(phaseGlyph(-radius, 0, iconR, "half-top", "yellow"));
}

buildTicks("ticks-hours", 200, 24, 6, "white", "white", 37.5);
buildTicks("ticks-clock", 150, 60, 5, "white", "white", 37.5);

var initJD = Date.now() / 86400000 + 2440587.5;

var tzName = Intl.DateTimeFormat().resolvedOptions().timeZone;
var currentLat = null;
var currentLon = null;
// Exactly four states. Only "located" and "manual" render the
// location-dependent marks. "locating" is the initial state; "unavailable"
// covers denial, timeout, an unsupported browser, or any other geolocation
// error. The reason for "unavailable" is tracked separately (below), not
// folded into the state itself.
var locationStatus = "locating";
var locationFailureReason = null;
var manualCityLabel = null; // "City, Region, Country" for the manual-selection display

// null (undecided) | "auto" | "manual" — which of the two choice buttons the
// user picked, separate from locationStatus. Geolocation is never started
// until the user explicitly asks for it; picking "manual" never calls it at
// all. A persisted manual city (loaded below) implies "manual" immediately.
var locationMode = null;

// null = follow the device's own local time zone (the "located" path: the
// device is presumed to be where its GPS/wifi says it is). A specific IANA
// name = a manually-selected city's zone, which may have nothing to do with
// the device's own zone. This is the ONLY place that answer is decided.
var displayTimeZone = null;

// The single source of truth both the hour hand (tick(), below) and the
// sun-event marks (computeDayEvents, below) read through — there is no
// second path that could resolve a different zone for one than the other.
// Native getTimezoneOffset() convention throughout: UTC minus local, in
// minutes (e.g. -120 for CEST).
function displayOffsetMinutes(instant) {
  if (!displayTimeZone) return instant.getTimezoneOffset();
  var inZone = new Date(instant.toLocaleString("en-US", { timeZone: displayTimeZone }));
  var inUTC = new Date(instant.toLocaleString("en-US", { timeZone: "UTC" }));
  return (inUTC - inZone) / 60000;
}

// Wall-clock date/time fields for `instant` as observed in the display
// timezone (see displayOffsetMinutes above), computed by shifting the
// instant by that offset and reading UTC getters on the result — sidesteps
// any ambiguity from double timezone conversion.
function displayWallClock(instant) {
  var offsetMin = displayOffsetMinutes(instant);
  var shifted = new Date(instant.getTime() - offsetMin * 60000);
  return {
    year: shifted.getUTCFullYear(),
    month: shifted.getUTCMonth(),
    date: shifted.getUTCDate(),
    hours: shifted.getUTCHours(),
    minutes: shifted.getUTCMinutes(),
    seconds: shifted.getUTCSeconds(),
    milliseconds: shifted.getUTCMilliseconds(),
    offsetMin: offsetMin
  };
}

// Local noon (in the DISPLAY timezone) of the calendar day containing
// refInstant, as an absolute instant. One offset refinement handles
// DST-transition days to the same precision the rest of this file already
// accepts. Used only by the live rendering path — see localNoon() below for
// the test/fixture path, which must stay independent of displayTimeZone.
function displayLocalNoon(refInstant) {
  var wall = displayWallClock(refInstant);
  var guess = new Date(Date.UTC(wall.year, wall.month, wall.date, 12, 0, 0, 0) + wall.offsetMin * 60000);
  var refinedOffset = displayOffsetMinutes(guess);
  return new Date(Date.UTC(wall.year, wall.month, wall.date, 12, 0, 0, 0) + refinedOffset * 60000);
}

// Local noon of the given date in the SYSTEM's own zone, as an absolute
// instant. Deliberately independent of displayTimeZone: this is used only
// by the verification/fixture blocks further down, which must keep testing
// a fixed, predictable zone regardless of what city a user has selected —
// see displayLocalNoon() above for the live-rendering equivalent.
function localNoon(dateInDay) {
  return new Date(dateInDay.getFullYear(), dateInDay.getMonth(), dateInDay.getDate(), 12, 0, 0, 0);
}

// sunEvents() results for one local day, at the default -0.833 threshold.
// offsetMin is passed in explicitly (rather than derived internally) so
// this stays a pure function with no hidden dependency on displayTimeZone
// or system time — callers decide which offset convention applies. Used
// only by the exact-coordinate astronomy fixtures below; the day ring
// itself no longer calls this at all (see halfDayAngle).
function computeDayEvents(noonInstant, offsetMin, lat, lon) {
  var jd = noonInstant.getTime() / 86400000 + 2440587.5;
  var sun = sunEvents(jd, lat, lon, TWILIGHT_H0[0]);
  return { offsetMin: offsetMin, sunrise: sun.sunrise, sunset: sun.sunset, noon: sun.noon };
}

// --- The day ring: a fixed-noon model on zone MEAN solar time. ---
//
// DOCUMENT THE TRADE. Dropping the equation of time shifts every mark on
// this ring by up to 16.4 minutes against the true sun (averaging 7.2
// minutes, exceeding 10 minutes on 118 days a year). Combined with the
// 30-minute zone (a constant -12.1 minutes at Rotterdam, see
// skyZoneOffsetMinutes) and the klima band's own latitude substitution, the
// sunrise/sunset marks can sit roughly half an hour from the real event.
// Day length, the noon/midnight mirror, and twilight-band widths remain
// exact — H is real astronomy, computed fresh every frame — only the
// PHASE (where the whole pattern sits relative to the true sun) is
// approximate. This is a deliberate choice of a fixed-noon model, traded
// for adaptability: any two observers sharing a zone and a klima band see
// an identical, predictable instrument, with no per-day event lookup.

// Solar noon is exactly 12:00 zone mean time and solar midnight exactly
// 00:00 — fixed positions, 180 degrees apart by construction, kept at the
// ring position they already occupied. Not computed from sunEvents, not
// blended across any day boundary: a genuine constant, not a per-frame
// calculation collapsed to one value.
function currentNoonAnchor() {
  return 0;
}

var markMidnight = document.getElementById("mark-solar-midnight");
var markNoon = document.getElementById("mark-solar-noon");
var markSunrise = document.getElementById("mark-sunrise");
var markSunset = document.getElementById("mark-sunset");
markSunrise.appendChild(phaseGlyph(0, 0, 14, "half-top", "#ffbf00"));
markSunset.appendChild(phaseGlyph(0, 0, 14, "half-bottom", "#ffbf00"));
var sunMarkRadius = 180; // between the clock (150) and hour (200) rings

// Places a half-yellow-circle glyph by translate only (never rotate — the
// glyph itself must stay upright as it moves around the ring), at ring
// fraction `fraction` (0 = top = zone-mean noon, clockwise).
function placeSunGlyphAtFraction(group, fraction) {
  var angle = fraction * 2 * Math.PI;
  var x = sunMarkRadius * Math.sin(angle);
  var y = -sunMarkRadius * Math.cos(angle);
  group.setAttribute("transform", "translate(" + x + "," + y + ")");
}

// ONE OSCILLATING SYSTEM. Sunrise, sunset and all six twilight boundaries
// come from a single quantity, the half-day angle H (see halfDayAngle
// above), evaluated fresh every frame at the klima latitude — no cached
// today/tomorrow tables, no blending across a day boundary, because H
// itself is already a smooth, continuous function of the instant: nothing
// to smooth over. Every mark sits symmetrically about noon by construction
// — morning = 720-4H minutes, evening = 720+4H minutes, i.e. ring
// fractions (1 - H/360) and (H/360) — so the mirror is exact, never two
// independently-computed sides that happen to agree.
function updateSunMarks() {
  var haveLoc = locationStatus === "located" || locationStatus === "manual";
  if (!haveLoc) {
    markMidnight.setAttribute("display", "none");
    markNoon.setAttribute("display", "none");
    markSunrise.setAttribute("display", "none");
    markSunset.setAttribute("display", "none");
    return;
  }
  markMidnight.removeAttribute("display");
  markNoon.removeAttribute("display");
  markNoon.setAttribute("transform", "rotate(" + currentNoonAnchor() + ")");
  markMidnight.setAttribute("transform", "rotate(" + (currentNoonAnchor() + 180) + ")");

  // Latitude-dependent from here down — longitude (the hand, noon/midnight
  // above) never hides for a polar klima band, only these do.
  var klimaLat = klimaLatitude(currentLat);
  if (klimaLat === null) {
    markSunrise.setAttribute("display", "none");
    markSunset.setAttribute("display", "none");
    return;
  }
  var jde = Date.now() / 86400000 + 2440587.5;
  var H = halfDayAngle(jde, klimaLat, TWILIGHT_H0[0]);
  if (H === null) {
    // A single day without sunrise/sunset near the polar circle — distinct
    // from the klima-polar case just above, which is excluded before this
    // point is ever reached.
    markSunrise.setAttribute("display", "none");
    markSunset.setAttribute("display", "none");
    return;
  }
  markSunrise.removeAttribute("display");
  markSunset.removeAttribute("display");
  placeSunGlyphAtFraction(markSunrise, ((1 - H / 360) % 1 + 1) % 1);
  placeSunGlyphAtFraction(markSunset, (H / 360) % 1);
}

// --- Twilight bands: filled arcs behind the day ring's ticks/marks/hand. ---

var TWILIGHT_INNER_R = 150, TWILIGHT_OUTER_R = 200;
var TWILIGHT_POOL_SIZE = 10; // max possible segments: 5 evening + 5 morning
var twilightPaths = [];
(function buildTwilightPool() {
  var group = document.getElementById("twilight-bands");
  for (var i = 0; i < TWILIGHT_POOL_SIZE; i++) {
    var path = document.createElementNS(svgNS, "path");
    path.setAttribute("stroke", "none");
    path.setAttribute("opacity", "0.8");
    group.appendChild(path);
    twilightPaths.push(path);
  }
})();

// Builds the day ring's twilight-band segments for jde/klimaLat, as a list
// of { from, to, color } fractions in the fixed (noon=0, midnight=0.5)
// frame, each a plain non-wrapping arc from `from` to `to`. Eight marks,
// four values of H (one halfDayAngle call per threshold), one function —
// see the comment above updateSunMarks.
//
// depth counts how many of the four thresholds (sunrise/sunset, civil,
// nautical, astronomical) return a real H at this instant, reading from
// brightest outward, stopping at the first null — the same threshold is
// null on both the dusk and dawn side by solar geometry (H is one number
// mirrored, not two independent ones), so whichever stage is the last one
// reached simply extends through midnight to fill the rest, exactly
// matching what the sky actually does that night.
//
// Only the sunrise/sunset threshold (depth 0) can be null while shallower
// ones are unaffected — deeper thresholds failing never un-fails a
// shallower one. If even sunrise/sunset is null, this is the reverse polar
// case: the sun's altitude at transit alone decides whether the whole ring
// is permanent day or permanent night.
function buildTwilightSegments(jde, klimaLat) {
  var Hs = TWILIGHT_H0.map(function(h0) { return halfDayAngle(jde, klimaLat, h0); });

  if (Hs[0] === null) {
    var dec = solarPosition(jde).declination;
    var altNoon = Math.asin(Math.sin(klimaLat * R) * Math.sin(dec * R) + Math.cos(klimaLat * R) * Math.cos(dec * R)) / R;
    return [{ from: 0, to: 1, color: altNoon > TWILIGHT_H0[0] ? TWILIGHT_COLORS[0] : TWILIGHT_COLORS[4] }];
  }

  var depth = 0;
  while (depth < 4 && Hs[depth] !== null) depth++;

  var segments = [];
  var last = 0, color = TWILIGHT_COLORS[0];
  for (var j = 0; j < depth; j++) {
    var evening = Hs[j] / 360;
    segments.push({ from: last, to: evening, color: color });
    last = evening;
    color = TWILIGHT_COLORS[j + 1];
  }
  segments.push({ from: last, to: 0.5, color: color });

  last = 0.5; color = TWILIGHT_COLORS[depth];
  for (var k = depth - 1; k >= 0; k--) {
    var morning = 1 - Hs[k] / 360;
    segments.push({ from: last, to: morning, color: color });
    last = morning;
    color = TWILIGHT_COLORS[k];
  }
  segments.push({ from: last, to: 1, color: color });

  return segments;
}

// An annular arc from fraction `fromFrac` to `toFrac` (0=top, clockwise),
// filling the ring between innerR and outerR. The large-arc-flag is always
// derived from the actual span — never assumed — since these bands range
// from a sliver (a short civil-twilight arc near the equator) to nearly a
// full half-ring (astronomical night at high latitude in winter).
function annularArcPath(fromFrac, toFrac, innerR, outerR) {
  var a0 = fromFrac * 2 * Math.PI, a1 = toFrac * 2 * Math.PI;
  var large = (toFrac - fromFrac) > 0.5 ? 1 : 0;
  var ox0 = outerR * Math.sin(a0), oy0 = -outerR * Math.cos(a0);
  var ox1 = outerR * Math.sin(a1), oy1 = -outerR * Math.cos(a1);
  var ix0 = innerR * Math.sin(a0), iy0 = -innerR * Math.cos(a0);
  var ix1 = innerR * Math.sin(a1), iy1 = -innerR * Math.cos(a1);
  return "M " + ox0 + " " + oy0 +
    " A " + outerR + " " + outerR + " 0 " + large + " 1 " + ox1 + " " + oy1 +
    " L " + ix1 + " " + iy1 +
    " A " + innerR + " " + innerR + " 0 " + large + " 0 " + ix0 + " " + iy0 +
    " Z";
}

// Recomputed every animation frame straight from Date.now() and the klima
// latitude — no cached state between frames, so the bands breathe
// continuously and stay correct indefinitely (see GEAR DISCIPLINE on
// halfDayAngle above).
function updateTwilightBands() {
  var haveLoc = locationStatus === "located" || locationStatus === "manual";
  var klimaLat = haveLoc ? klimaLatitude(currentLat) : null;
  if (klimaLat === null) {
    twilightPaths.forEach(function(path) { path.setAttribute("display", "none"); });
    return;
  }
  var jde = Date.now() / 86400000 + 2440587.5;
  var segments = buildTwilightSegments(jde, klimaLat);
  for (var i = 0; i < twilightPaths.length; i++) {
    if (i < segments.length) {
      var seg = segments[i];
      twilightPaths[i].setAttribute("d", annularArcPath(seg.from, seg.to, TWILIGHT_INNER_R, TWILIGHT_OUTER_R));
      twilightPaths[i].setAttribute("fill", seg.color);
      twilightPaths[i].removeAttribute("display");
    } else {
      twilightPaths[i].setAttribute("display", "none");
    }
  }
}

// "klima 16h30m (50.7 N)" or "klima POLAR" — two locations sharing a solar
// zone and a klima band see an identical clock, so both settings are shown
// together, and this is the single place that combines them for display.
function klimaDisplayText(latDeg) {
  if (latDeg === null) return null;
  if (isPolarLatitude(latDeg)) return "klima POLAR";
  var representative = klimaLatitude(latDeg);
  var dir = representative >= 0 ? "N" : "S";
  return "klima " + formatKlimaHours(klimaHours(latDeg)) + " (" + Math.abs(representative).toFixed(1) + " " + dir + ")";
}

function updateLocationInfo() {
  var text;
  var skyZoneText = currentLon === null ? null : formatOffsetMinutes(skyZoneOffsetMinutes(currentLon));
  var klimaText = klimaDisplayText(currentLat);
  if (locationStatus === "manual") {
    text = (manualCityLabel || "Selected city") + " · timezone: " + displayTimeZone + " · solar zone: " + skyZoneText + " · " + klimaText + " · manual";
  } else if (locationStatus === "located") {
    var latDir = currentLat >= 0 ? "N" : "S";
    var lonDir = currentLon >= 0 ? "E" : "W";
    text = Math.abs(currentLat).toFixed(2) + " " + latDir + ", "
      + Math.abs(currentLon).toFixed(2) + " " + lonDir + " · timezone: " + tzName + " · solar zone: " + skyZoneText + " · " + klimaText + " · located";
  } else if (locationMode === null) {
    text = ""; // the choice buttons below speak for themselves
  } else if (locationMode === "manual") {
    text = "Enter a city below";
  } else if (locationStatus === "locating") {
    text = "Locating" + (locationFailureReason ? " (retrying after " + locationFailureReason + ")" : "…");
  } else {
    text = "Location unavailable" + (locationFailureReason ? " (" + locationFailureReason + ")" : "");
  }
  document.getElementById("location-info").textContent = text;

  // The choice buttons only make sense before any mode has been picked.
  // City search makes sense once the user has chosen manual mode (whether
  // or not they've picked a city yet) or once automatic has actually
  // failed. Clear/change makes sense once a location is established either
  // way, so the user isn't stuck with a first choice.
  document.getElementById("location-choice").style.display = locationMode === null ? "block" : "none";
  var showSearch = locationStatus === "unavailable" || (locationMode === "manual" && locationStatus !== "manual");
  document.getElementById("city-search-container").style.display = showSearch ? "block" : "none";
  document.getElementById("clear-location-btn").style.display =
    (locationStatus === "manual" || locationStatus === "located") ? "inline-block" : "none";
  if (!showSearch) {
    document.getElementById("city-search-input").value = "";
    document.getElementById("city-search-results").innerHTML = "";
  }
}

// Open-Meteo geocoding: keyless, CORS-enabled (access-control-allow-origin:
// *, confirmed with an actual fetch from a file:// page before this was
// built). The only network dependency in this file, and it is wired up
// only here — nothing on the located/manual/locating paths ever calls it.
var CITY_SEARCH_URL = "https://geocoding-api.open-meteo.com/v1/search";
var MANUAL_LOCATION_STORAGE_KEY = "threeBodyClock.manualLocation";
var citySearchDebounceTimer = null;

function cityLabel(result) {
  return result.name + (result.admin1 ? ", " + result.admin1 : "") + ", " + result.country;
}

function selectCity(result) {
  currentLat = result.latitude;
  currentLon = result.longitude;
  displayTimeZone = result.timezone;
  manualCityLabel = cityLabel(result);
  locationMode = "manual";
  locationStatus = "manual";
  locationFailureReason = null;
  try {
    localStorage.setItem(MANUAL_LOCATION_STORAGE_KEY, JSON.stringify({
      lat: currentLat, lon: currentLon, tz: displayTimeZone, label: manualCityLabel
    }));
  } catch (e) {
    // storage unavailable (private browsing, quota) — selection still works this session
  }
  updateSunMarks();
  updateTwilightBands();
  updateLocationInfo();
}

document.getElementById("city-search-input").addEventListener("input", function(e) {
  var query = e.target.value.trim();
  clearTimeout(citySearchDebounceTimer);
  var resultsEl = document.getElementById("city-search-results");
  if (query.length < 2) {
    resultsEl.innerHTML = "";
    return;
  }
  citySearchDebounceTimer = setTimeout(function() {
    fetch(CITY_SEARCH_URL + "?name=" + encodeURIComponent(query) + "&count=8&language=en&format=json")
      .then(function(r) { return r.json(); })
      .then(function(data) {
        resultsEl.innerHTML = "";
        (data.results || []).forEach(function(result) {
          var li = document.createElement("li");
          li.textContent = cityLabel(result);
          li.addEventListener("click", function() { selectCity(result); });
          resultsEl.appendChild(li);
        });
      })
      .catch(function() {
        // network hiccup during search — leave the list as it was, no crash, no alert
      });
  }, 300);
});

document.getElementById("clear-location-btn").addEventListener("click", function() {
  try { localStorage.removeItem(MANUAL_LOCATION_STORAGE_KEY); } catch (e) {}
  currentLat = null;
  currentLon = null;
  displayTimeZone = null;
  manualCityLabel = null;
  locationStatus = "locating";
  locationFailureReason = null;
  geoAttempt = 0;
  locationMode = null; // back to the choice screen — don't assume last time's pick
  updateSunMarks();
  updateTwilightBands();
  updateLocationInfo();
});

function loadPersistedManualLocation() {
  try {
    var raw = localStorage.getItem(MANUAL_LOCATION_STORAGE_KEY);
    if (!raw) return false;
    var saved = JSON.parse(raw);
    if (typeof saved.lat !== "number" || typeof saved.lon !== "number" || !saved.tz) return false;
    currentLat = saved.lat;
    currentLon = saved.lon;
    displayTimeZone = saved.tz;
    manualCityLabel = saved.label || null;
    locationMode = "manual";
    locationStatus = "manual";
    return true;
  } catch (e) {
    return false;
  }
}

// A persisted manual city takes priority over geolocation entirely — if the
// user picked one deliberately, don't second-guess it on every reload.
// Otherwise updateSunMarks() hides the four location-dependent marks itself
// (locationStatus is still "locating"); nothing is drawn from a guess.
loadPersistedManualLocation();
updateSunMarks();
updateTwilightBands();
updateLocationInfo();

// Geolocation requires https or localhost; opening the file directly from
// disk always falls back to "unavailable" (unsupported/blocked in that
// context), which is reported, not silently swapped for a default.
var GEO_MAX_ATTEMPTS = 3;
var geoAttempt = 0;

function requestLocation() {
  geoAttempt++;
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      currentLat = pos.coords.latitude;
      currentLon = pos.coords.longitude;
      displayTimeZone = null; // device's own zone, not a leftover manual one
      manualCityLabel = null;
      locationStatus = "located";
      locationFailureReason = null;
      updateSunMarks();
      updateTwilightBands();
      updateLocationInfo();
    },
    function(err) {
      var code = err && err.code;

      // PERMISSION_DENIED: the browser will not re-prompt this session, so
      // retrying is pointless — go straight to unavailable.
      if (code === 1) {
        locationStatus = "unavailable";
        locationFailureReason = "denied";
        updateLocationInfo();
        return;
      }

      // POSITION_UNAVAILABLE (2) or TIMEOUT (3): transient, worth retrying
      // with backoff, up to GEO_MAX_ATTEMPTS total attempts.
      var reason = code === 3 ? "timeout" : "position unavailable";
      locationFailureReason = reason; // visible even mid-retry, not just on final failure
      if (geoAttempt < GEO_MAX_ATTEMPTS) {
        updateLocationInfo();
        setTimeout(requestLocation, 1000 * Math.pow(2, geoAttempt - 1)); // 1s, 2s
      } else {
        locationStatus = "unavailable";
        updateLocationInfo();
      }
    },
    // High accuracy is deliberately off: we need longitude, not metres — a
    // 100km position error moves solar noon by under 6 minutes — so the
    // fast, low-power path is the right one, not GPS-grade precision.
    { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 }
  );
}

// Geolocation is never started automatically — only in response to the
// "Use my location" button below. If a manual city was already restored
// above, locationMode is "manual" and the choice screen never shows at all.
document.getElementById("choice-auto-btn").addEventListener("click", function() {
  locationMode = "auto";
  updateLocationInfo();
  if (navigator.geolocation) {
    requestLocation();
  } else {
    locationStatus = "unavailable";
    locationFailureReason = "unsupported";
    updateLocationInfo();
  }
});

document.getElementById("choice-manual-btn").addEventListener("click", function() {
  locationMode = "manual";
  updateLocationInfo();
  document.getElementById("city-search-input").focus();
});

// --- Verification: the day ring's fixed-noon, zone-mean-time model. ---

// Noon and midnight are exactly 180 degrees apart at every instant — true
// by construction (currentNoonAnchor is a genuine constant, midnight is

function minutesToLocalTime(minUTC, utcOffsetHours) {
  var total = ((minUTC + utcOffsetHours * 60) % 1440 + 1440) % 1440;
  var hh = Math.floor(total / 60);
  var mm = Math.round(total % 60);
  if (mm === 60) { mm = 0; hh = (hh + 1) % 24; }
  return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
}

function formatOffsetMinutes(totalMinutes) {
  var sign = totalMinutes < 0 ? "-" : "+";
  var absMinutes = Math.abs(totalMinutes);
  var hh = Math.floor(absMinutes / 60);
  var mm = absMinutes % 60;
  return sign + (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
}

function minutesOfDayToClockText(totalMinutes) {
  var wrapped = ((totalMinutes % 1440) + 1440) % 1440;

function tick() {
  var now = new Date();
  var haveLocation = locationStatus === "located" || locationStatus === "manual";

  // Single source of truth for the civil 12-hour face (see
  // displayOffsetMinutes/displayWallClock above). Until a location is found
  // or entered, civil time isn't meaningful yet (displayTimeZone would just
  // be guessing at device-local), so all civil hands point straight up
  // instead of ticking on an unearned assumption.
  var wall = haveLocation ? displayWallClock(now) : null;
  var secFraction = haveLocation ? (wall.seconds + wall.milliseconds / 1000) / 60 : 0;
  var minFraction = haveLocation ? (wall.minutes + secFraction) / 60 : 0;

  var clockHourFraction = haveLocation ? ((wall.hours % 12) + minFraction) / 12 : 0;
  handClockHour.setAttribute("transform", "rotate(" + (clockHourFraction * 360) + ")");
  handClockMinute.setAttribute("transform", "rotate(" + (minFraction * 360) + ")");
  handClockSecond.setAttribute("transform", "rotate(" + (secFraction * 360) + ")");

  // ONE OSCILLATING SYSTEM: the day ring's hand and the central clock's
  // amber hands are both derived from this single quantity — zone MEAN
  // solar time, UTC + skyZoneOffsetMinutes(lon). No equation of time
  // anywhere here (see DOCUMENT THE TRADE above updateSunMarks): this is a
  // fixed-noon model, not a true instrument, traded deliberately for
  // adaptability. Deliberately NO dependency on civil time or the timezone
  // database either: Date.now() is milliseconds since the Unix epoch,
  // itself a UTC midnight, so dividing by 60000 and taking %1440 gives UTC
  // minutes-of-day directly — continuous to the millisecond, no
  // getUTCHours/Minutes/Seconds decomposition, no wall-clock component to
  // desync from, and no per-day cache to go stale.
  //
  // The day ring's own "noon" is fixed at minute 720 (see
  // currentNoonAnchor) — hand fraction 0 there, increasing clockwise.
  if (haveLocation) {
    var zoneMeanMinutesOfDay = (((Date.now() / 60000) + skyZoneOffsetMinutes(currentLon)) % 1440 + 1440) % 1440;

    var dayRingFraction = (((zoneMeanMinutesOfDay - 720) / 1440) % 1 + 1) % 1;
    handHours.setAttribute("transform", "rotate(" + (dayRingFraction * 360) + ")");

    var skyMinFraction = (zoneMeanMinutesOfDay % 60) / 60;
    var skyHour12 = Math.floor(zoneMeanMinutesOfDay / 60) % 12; // integer hour only — skyMinFraction supplies the fraction
    var skyHourFraction = (skyHour12 + skyMinFraction) / 12;
    handSolarMeanHour.setAttribute("transform", "rotate(" + (skyHourFraction * 360) + ")");
    handSolarMeanMinute.setAttribute("transform", "rotate(" + (skyMinFraction * 360) + ")");
  } else {
    handHours.setAttribute("transform", "rotate(0)");
    handSolarMeanHour.setAttribute("transform", "rotate(0)");
    handSolarMeanMinute.setAttribute("transform", "rotate(0)");
  }

  var jd = Date.now() / 86400000 + 2440587.5;
  var lunarFraction = lunarPointerFraction(jd);
  handLunar.setAttribute("transform", "rotate(" + (lunarFraction * 360) + ")");

  var solarFraction = solarPointerFraction(jd);
  handSolar.setAttribute("transform", "rotate(" + (solarFraction * 360) + ")");

  // H is recomputed straight from Date.now() every frame (see
  // buildTwilightSegments/updateSunMarks), so the marks and bands are
  // always continuous with no per-day cache to roll over.
  updateSunMarks();
  updateTwilightBands();

  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
</script>
