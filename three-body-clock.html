<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
  background: black;
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
svg {
  display: block;
  width: 90vmin;
  height: 90vmin;
}
#location-info {
  color: grey;
  font-family: sans-serif;
  font-size: 12px;
  margin-top: 8px;
  text-align: center;
}
#city-search-container {
  display: none;
  margin-top: 8px;
  text-align: center;
}
#city-search-input {
  background: #111;
  color: #eee;
  border: 1px solid grey;
  border-radius: 4px;
  padding: 4px 8px;
  font-family: sans-serif;
  font-size: 12px;
  width: 220px;
}
#city-search-results {
  list-style: none;
  margin: 4px auto 0;
  padding: 0;
  max-width: 260px;
  max-height: 160px;
  overflow-y: auto;
}
#city-search-results li {
  color: #ccc;
  font-family: sans-serif;
  font-size: 12px;
  padding: 4px 8px;
  cursor: pointer;
  text-align: left;
}
#city-search-results li:hover {
  background: #222;
}
#clear-location-btn {
  display: none;
  margin-top: 8px;
  background: none;
  border: 1px solid grey;
  color: grey;
  font-family: sans-serif;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
}
</style>
</head>
<body>
<svg viewBox="-420 -420 840 840">
<circle cx="0" cy="0" r="200" fill="none" stroke="grey" stroke-width="2" />
<circle cx="0" cy="0" r="250" fill="none" stroke="grey" stroke-width="2" />
<circle cx="0" cy="0" r="300" fill="none" stroke="grey" stroke-width="2" />
<circle cx="0" cy="0" r="150" fill="none" stroke="grey" stroke-width="2" />
<g id="sun-events">
<g id="mark-solar-midnight">
<line x1="0" y1="-200" x2="0" y2="-162.5" stroke="blue" stroke-width="4" />
</g>
<g id="mark-solar-noon">
<line x1="0" y1="-200" x2="0" y2="-162.5" stroke="lightblue" stroke-width="4" />
</g>
<g id="mark-sunrise"></g>
<g id="mark-sunset"></g>
</g>
<g id="ticks-hours"></g>
<g id="ticks-lunar"></g>
<g id="ticks-solar"></g>
<g id="ticks-clock"></g>
<!-- All crimson hands are kept last so they always render above every ring, tick and mark. -->

<line x1="0" y1="-255" x2="0" y2="-295.5" stroke="crimson" stroke-width="6" stroke-linecap="round" />

<line x1="0" y1="-155" x2="0" y2="-195.5" stroke="crimson" stroke-width="6" stroke-linecap="round" />
</g>

<line x1="0" y1="0" x2="0" y2="-70" stroke="crimson" stroke-width="8" stroke-linecap="round" />
</g>

</svg>
<div id="location-info"></div>

</div>

<script>
var svgNS = "http://www.w3.org/2000/svg";
var cx = 0, cy = 0;

var ROTTERDAM_LAT = 51.9225;
var ROTTERDAM_LON = 4.47917;

// Copied verbatim from files/calendar-mechanism.html (there named ph, not phJDE)
var R = Math.PI / 180;
var SM = 29.530589;
function ph(k,q){ // JDE of lunar phase: q=0 new, 0.5 full (Meeus ch.49, full 16-term series)
  var T=k/1236.85;
  var J=2451550.09766+29.530588861*(k+q)+0.00015437*T*T;
  var E=1-0.002516*T-0.0000074*T*T, kk=k+q;
  var M=(2.5534+29.10535670*kk)*R, Mp=(201.5643+385.81693528*kk)*R, F=(160.7108+390.67050284*kk)*R;
  var Om=(124.7746-1.56375588*k)*R;
  var tail = -0.00111*Math.sin(Mp-2*F) - 0.00057*Math.sin(Mp+2*F) + 0.00056*E*Math.sin(2*Mp+M)
    - 0.00042*Math.sin(3*Mp) + 0.00042*E*Math.sin(M+2*F) + 0.00038*E*Math.sin(M-2*F)
    - 0.00024*E*Math.sin(2*Mp-M) - 0.00017*Math.sin(Om) - 0.00007*Math.sin(Mp+2*M);
  if(q===0.5){
    return J-0.40614*Math.sin(Mp)+0.17302*E*Math.sin(M)+0.01614*Math.sin(2*Mp)
      +0.01043*Math.sin(2*F)+0.00734*E*Math.sin(Mp-M)-0.00514*E*Math.sin(Mp+M)
      +0.00209*E*E*Math.sin(2*M)+tail;
  }
  return J-0.40720*Math.sin(Mp)+0.17241*E*Math.sin(M)+0.01608*Math.sin(2*Mp)
    +0.01039*Math.sin(2*F)+0.00739*E*Math.sin(Mp-M)-0.00514*E*Math.sin(Mp+M)
    +0.00208*E*E*Math.sin(2*M)+tail;
}

// Meeus 49.3: quarter-phase correction, applied on top of the same base J/E/M/Mp/F as ph().
// q=0.25 (first quarter) adds W, q=0.75 (last quarter) subtracts it.
function phQuarter(k, q) {
  var T=k/1236.85;
  var J=2451550.09766+29.530588861*(k+q)+0.00015437*T*T;
  var E=1-0.002516*T-0.0000074*T*T, kk=k+q;
  var M=(2.5534+29.10535670*kk)*R, Mp=(201.5643+385.81693528*kk)*R, F=(160.7108+390.67050284*kk)*R;
  var c = -0.62801*Math.sin(Mp) + 0.17172*E*Math.sin(M) - 0.01183*E*Math.sin(Mp+M)
      + 0.00862*Math.sin(2*Mp) + 0.00804*Math.sin(2*F) + 0.00454*E*Math.sin(Mp-M)
      + 0.00204*E*E*Math.sin(2*M) - 0.00180*Math.sin(Mp-2*F) - 0.00070*Math.sin(Mp+2*F);
  var W = 0.00306 - 0.00038*E*Math.cos(M) + 0.00026*Math.cos(Mp);
  return q === 0.25 ? J + c + W : J + c - W;
}

// Largest k where ph(k, 0.5) <= t
function fullMoonK(t) {
  var k = Math.floor((t - 2451550.09766) / SM);
  while (ph(k, 0.5) <= t) k++;
  return k - 1;
}

// Meeus ch.47: Moon's geocentric ecliptic longitude, mean longitude L'
// plus the leading periodic terms of table 47.A. Five of these terms
// (sin(M), sin(2D-M-M'), sin(2D-M), sin(M-M'), sin(M+M')) carry an E
// eccentricity factor in the table; it's omitted here as negligible
// (E is about 0.99933, so dropping it costs ~0.00015 deg), not because
// these terms are E-independent.
//
// The five angle arguments below (L', D, M, M', F) also drop their T^2
// secular terms, unlike ph()/phQuarter(), which keep theirs. That costs
// ~0.00004 deg in 2026, ~0.0003 deg by 2100, ~0.022 deg by 2500, and
// ~0.20 deg by 3000 — the ring drifts slowly over millennia even though
// the calendar's phase dates (from ph()/phQuarter()) do not.
function moonLongitude(jde) {
  var T = (jde - 2451545.0) / 36525;
  var Lp = 218.3164477 + 481267.88123421 * T;
  var D = 297.8501921 + 445267.1114034 * T;
  var M = 357.5291092 + 35999.0502909 * T;
  var Mp = 134.9633964 + 477198.8675055 * T;
  var F = 93.2720950 + 483202.0175233 * T;

  var Dr = D * R, Mr = M * R, Mpr = Mp * R, Fr = F * R;

  var sum = 6.288774 * Math.sin(Mpr)
    + 1.274027 * Math.sin(2 * Dr - Mpr)
    + 0.658314 * Math.sin(2 * Dr)
    + 0.213618 * Math.sin(2 * Mpr)
    - 0.185116 * Math.sin(Mr)
    - 0.114332 * Math.sin(2 * Fr)
    + 0.058793 * Math.sin(2 * Dr - 2 * Mpr)
    + 0.057066 * Math.sin(2 * Dr - Mr - Mpr)
    + 0.053322 * Math.sin(2 * Dr + Mpr)
    + 0.045758 * Math.sin(2 * Dr - Mr)
    - 0.040923 * Math.sin(Mr - Mpr)
    - 0.034720 * Math.sin(Dr)
    - 0.030383 * Math.sin(Mr + Mpr)
    + 0.015327 * Math.sin(2 * Dr - 2 * Fr)
    - 0.012528 * Math.sin(Mpr + 2 * Fr)
    + 0.010980 * Math.sin(Mpr - 2 * Fr)
    + 0.010675 * Math.sin(4 * Dr - Mpr)
    + 0.010034 * Math.sin(3 * Mpr)
    + 0.008548 * Math.sin(4 * Dr - 2 * Mpr);

  return ((Lp + sum) % 360 + 360) % 360;
}

// The lunar ring's marks sit at fixed 0/25/50/75% (the phases ARE quarters,
// exact elongations). The ring IS elongation D = moonLongitude - sunLongitude,
// anchored so full moon (D=180) sits at 0%: no interpolation, exact everywhere.
function lunarPointerFraction(t) {
  var elong = moonLongitude(t) - sunLongitude(t);
  return (((elong - 180) % 360 + 360) % 360) / 360;
}

// Meeus 22.2: mean obliquity of the ecliptic (degrees).
function obliquity(jde) {
  var T = (jde - 2451545.0) / 36525;
  return 23.439291 - 0.0130042 * T - 0.00000016 * T * T + 0.000000504 * T * T * T;
}

// Wrap a degree value into -180..+180.
function wrapTo180(deg) {
  return ((deg % 360) + 540) % 360 - 180;
}

// Standard low-precision solar position (Meeus ch.25): mean longitude L0,
// mean anomaly M, equation of centre C, then corrected for aberration and
// nutation to get APPARENT longitude — the quantity the equinoxes and
// solstices are actually defined against (worth ~0.0033 deg, ~5 min of time).
// Tilting lambda by the obliquity (Meeus 22) gives declination and right
// ascension; those plus L0 give the equation of time, all needed for
// sunrise/sunset.
function solarPosition(jde) {
  var T = (jde - 2451545.0) / 36525;
  var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  var M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  var Mr = M * R;
  var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mr)
    + (0.019993 - 0.000101 * T) * Math.sin(2 * Mr)
    + 0.000289 * Math.sin(3 * Mr);
  var trueLong = L0 + C;
  var Omega = 125.04 - 1934.136 * T;
  var lambda = trueLong - 0.00569 - 0.00478 * Math.sin(Omega * R);
  lambda = ((lambda % 360) + 360) % 360;

  var eps = obliquity(jde);
  var epsR = eps * R;
  var lambdaR = lambda * R;

  var declination = Math.asin(Math.sin(epsR) * Math.sin(lambdaR)) / R;
  var rightAscension = Math.atan2(Math.cos(epsR) * Math.sin(lambdaR), Math.cos(lambdaR)) / R;
  rightAscension = ((rightAscension % 360) + 360) % 360;

  var eot = 4 * wrapTo180(L0 - 0.0057183 - rightAscension);

  return {
    lambda: lambda,
    epsilon: eps,
    declination: declination,
    rightAscension: rightAscension,
    eot: eot,
    L0: L0
  };
}

// Thin wrapper kept so solarPointerFraction/solarLongitudeCrossing don't change.
function sunLongitude(jde) {
  return solarPosition(jde).lambda;
}

// The solar ring IS longitude: no interpolation needed, exact everywhere.
// 270 deg is the winter solstice, the ring's 0% mark.
function solarPointerFraction(t) {
  var lambda = sunLongitude(t);
  return (((lambda - 270) % 360 + 360) % 360) / 360;
}

// JD for a UTC calendar date, used only to seed the Newton solve below —
// needs to be within half a year of the true crossing, nothing more.
function seedJD(y, month, day) {
  return Date.UTC(y, month - 1, day) / 86400000 + 2440587.5;
}

// The single source of truth for solstices/equinoxes: the instant the sun's
// apparent longitude equals targetDeg. Newton iteration using the sun's mean
// rate (~0.9856 deg/day); the angular error is wrapped into -180..+180 each
// step so it always steps toward the nearest crossing. Converges in 3-4
// iterations; the loop runs a couple extra for margin.
function solarLongitudeCrossing(targetDeg, guessJD) {
  var jd = guessJD;
  for (var i = 0; i < 8; i++) {
    var delta = ((targetDeg - sunLongitude(jd) + 180) % 360 + 360) % 360 - 180;
    var step = delta / 0.9856;
    jd += step;
    if (Math.abs(step) < 1 / 86400) break; // under a second
  }
  return jd;
}

// Sunrise, solar noon and sunset for a given day (jde, at or near 0h UT)
// and location, all as minutes from UTC midnight. Standard sunrise equation
// using the hour angle of the sun at the -0.833 deg altitude (accounts for
// the sun's apparent radius and average atmospheric refraction). Returns
// null sunrise/sunset when |cosH| > 1 — the sun never crosses that
// altitude that day (polar day or polar night) — rather than throwing on
// the domain error acos() would raise.
function sunEvents(jde, latDeg, lonDegEast) {
  var pos = solarPosition(jde);
  var latR = latDeg * R;
  var decR = pos.declination * R;
  var cosH = (Math.sin(-0.833 * R) - Math.sin(latR) * Math.sin(decR)) / (Math.cos(latR) * Math.cos(decR));
  var noon = 720 - 4 * lonDegEast - pos.eot;

  if (Math.abs(cosH) > 1) {
    return { sunrise: null, sunset: null, noon: noon };
  }

  var H = Math.acos(cosH) / R;
  return { sunrise: noon - 4 * H, sunset: noon + 4 * H, noon: noon };
}

// Calendar year of the December solstice (longitude 270) at or before t
function solsticeYear(t) {
  var g = new Date((t - 2440587.5) * 86400000).getUTCFullYear();
  var thisDecSol = solarLongitudeCrossing(270, seedJD(g, 12, 21));
  return t >= thisDecSol ? g : g - 1;
}

function buildTicks(groupId, radius, count, majorEvery, topColor, tickColor, maxLen) {
  var group = document.getElementById(groupId);
  var lenMajor = maxLen ? Math.min(radius * 0.3, maxLen) : radius * 0.3;
  var lenMinor = lenMajor * 0.7;
  var edge = cy - radius;
  var inner = edge + lenMajor;
  var outerShort = edge + (lenMajor - lenMinor);
  var step = 360 / count;

  for (var i = 0; i < count; i++) {
    var isMajor = i % majorEvery === 0;
    var tick = document.createElementNS(svgNS, "line");
    tick.setAttribute("x1", cx);
    tick.setAttribute("y1", isMajor ? edge : outerShort);
    tick.setAttribute("x2", cx);
    tick.setAttribute("y2", inner);
    tick.setAttribute("stroke", i === 0 ? topColor : tickColor);
    tick.setAttribute("stroke-width", isMajor ? "4" : "2");
    tick.setAttribute("transform", "rotate(" + (i * step) + ")");
    group.appendChild(tick);
  }
}

// Small phase glyph: "full" = filled disc, "ring"/"new" = outline only,
// "first"/"last" = half-lit disc split on the vertical (right/left),
// "half-top"/"half-bottom" = half-lit disc split on the horizontal.
function phaseGlyph(x, y, r, phase, color) {
  var g = document.createElementNS(svgNS, "g");
  var disc = document.createElementNS(svgNS, "circle");
  disc.setAttribute("cx", x);
  disc.setAttribute("cy", y);
  disc.setAttribute("r", r);
  disc.setAttribute("fill", phase === "full" ? color : "none");
  disc.setAttribute("stroke", color);
  disc.setAttribute("stroke-width", "2");
  g.appendChild(disc);

  var halves = {
    first: [x, y - r, x, y + r, 1],       // right half
    last: [x, y - r, x, y + r, 0],        // left half
    "half-top": [x - r, y, x + r, y, 1],  // top half
    "half-bottom": [x - r, y, x + r, y, 0] // bottom half
  };
  var h = halves[phase];
  if (h) {
    var half = document.createElementNS(svgNS, "path");
    half.setAttribute("d", "M " + h[0] + " " + h[1] + " A " + r + " " + r + " 0 0 " + h[4] + " " + h[2] + " " + h[3] + " Z");
    half.setAttribute("fill", color);
    g.appendChild(half);
  }

  return g;
}

function buildMoonPhaseMarks(groupId, radius, iconR) {
  var group = document.getElementById(groupId);
  group.appendChild(phaseGlyph(0, -radius, iconR, "full", "white"));
  group.appendChild(phaseGlyph(radius, 0, iconR, "last", "white"));
  group.appendChild(phaseGlyph(0, radius, iconR, "new", "white"));
  group.appendChild(phaseGlyph(-radius, 0, iconR, "first", "white"));
}

function buildSunPhaseMarks(groupId, radius, iconR) {
  var group = document.getElementById(groupId);
  group.appendChild(phaseGlyph(0, -radius, iconR, "ring", "yellow"));
  group.appendChild(phaseGlyph(radius, 0, iconR, "half-top", "yellow"));
  group.appendChild(phaseGlyph(0, radius, iconR, "full", "yellow"));
  group.appendChild(phaseGlyph(-radius, 0, iconR, "half-top", "yellow"));
}

buildTicks("ticks-hours", 200, 24, 6, "white", "grey", 37.5);
buildTicks("ticks-clock", 150, 60, 5, "white", "grey", 37.5);

var initJD = Date.now() / 86400000 + 2440587.5;

var tzName = Intl.DateTimeFormat().resolvedOptions().timeZone;
var currentLat = null;
var currentLon = null;
// Exactly four states. Only "located" and "manual" render the
// location-dependent marks. "locating" is the initial state; "unavailable"
// covers denial, timeout, an unsupported browser, or any other geolocation
// error. The reason for "unavailable" is tracked separately (below), not
// folded into the state itself.
var locationStatus = "locating";
var locationFailureReason = null;
var manualCityLabel = null; // "City, Region, Country" for the manual-selection display

// null = follow the device's own local time zone (the "located" path: the
// device is presumed to be where its GPS/wifi says it is). A specific IANA
// name = a manually-selected city's zone, which may have nothing to do with
// the device's own zone. This is the ONLY place that answer is decided.
var displayTimeZone = null;

// The single source of truth both the hour hand (tick(), below) and the
// sun-event marks (computeDayEvents, below) read through — there is no
// second path that could resolve a different zone for one than the other.
// Native getTimezoneOffset() convention throughout: UTC minus local, in
// minutes (e.g. -120 for CEST).
function displayOffsetMinutes(instant) {
  if (!displayTimeZone) return instant.getTimezoneOffset();
  var inZone = new Date(instant.toLocaleString("en-US", { timeZone: displayTimeZone }));
  var inUTC = new Date(instant.toLocaleString("en-US", { timeZone: "UTC" }));
  return (inUTC - inZone) / 60000;
}

// Wall-clock date/time fields for `instant` as observed in the display
// timezone (see displayOffsetMinutes above), computed by shifting the
// instant by that offset and reading UTC getters on the result — sidesteps
// any ambiguity from double timezone conversion.
function displayWallClock(instant) {
  var offsetMin = displayOffsetMinutes(instant);
  var shifted = new Date(instant.getTime() - offsetMin * 60000);
  return {
    year: shifted.getUTCFullYear(),
    month: shifted.getUTCMonth(),
    date: shifted.getUTCDate(),
    hours: shifted.getUTCHours(),
    minutes: shifted.getUTCMinutes(),
    seconds: shifted.getUTCSeconds(),
    milliseconds: shifted.getUTCMilliseconds(),
    offsetMin: offsetMin
  };
}

// Local noon (in the DISPLAY timezone) of the calendar day containing
// refInstant, as an absolute instant. One offset refinement handles
// DST-transition days to the same precision the rest of this file already
// accepts. Used only by the live rendering path — see localNoon() below for
// the test/fixture path, which must stay independent of displayTimeZone.
function displayLocalNoon(refInstant) {
  var wall = displayWallClock(refInstant);
  var guess = new Date(Date.UTC(wall.year, wall.month, wall.date, 12, 0, 0, 0) + wall.offsetMin * 60000);
  var refinedOffset = displayOffsetMinutes(guess);
  return new Date(Date.UTC(wall.year, wall.month, wall.date, 12, 0, 0, 0) + refinedOffset * 60000);
}

// Local noon of the given date in the SYSTEM's own zone, as an absolute
// instant. Deliberately independent of displayTimeZone: this is used only
// by the verification/fixture blocks further down, which must keep testing
// a fixed, predictable zone regardless of what city a user has selected —
// see displayLocalNoon() above for the live-rendering equivalent.
function localNoon(dateInDay) {
  return new Date(dateInDay.getFullYear(), dateInDay.getMonth(), dateInDay.getDate(), 12, 0, 0, 0);
}

// sunEvents() results for one local day. offsetMin is passed in explicitly
// (rather than derived internally) so this stays a pure function with no
// hidden dependency on displayTimeZone or system time — callers decide
// which offset convention applies.
function computeDayEvents(noonInstant, offsetMin, lat, lon) {
  var jd = noonInstant.getTime() / 86400000 + 2440587.5;
  var sun = sunEvents(jd, lat, lon);
  return { offsetMin: offsetMin, sunrise: sun.sunrise, sunset: sun.sunset, noon: sun.noon };
}

function dayFractionOf(utcMinutes, offsetMin) {
  if (utcMinutes === null) return null;
  return ((utcMinutes - offsetMin) % 1440 + 1440) % 1440 / 1440;
}

// Wrap-safe linear blend between two fractions-of-a-circle (0..1), by
// weight p in [0,1]. Always takes the short way round, so it's safe even
// when fA/fB sit on opposite sides of the 0/1 seam (e.g. solar midnight).
function blendFraction(fA, fB, p) {
  var delta = fB - fA;
  delta -= Math.round(delta);
  return ((fA + p * delta) % 1 + 1) % 1;
}

// The day-before/day-after event sets, cached and only recomputed on a
// location change or a local-date rollover — NOT every frame. The blended
// positions computed from them, below, are recomputed every frame.
var cachedToday, cachedTomorrow, lastLocalDateStr;
var lastSunMarksCheck = 0;
function refreshDayEventCache(refDate) {
  var ref = refDate || new Date();
  var wall = displayWallClock(ref);

  var todayNoon = displayLocalNoon(ref);
  cachedToday = computeDayEvents(todayNoon, displayOffsetMinutes(todayNoon), currentLat, currentLon);

  // Date.UTC with date+1 (not +24h) so a DST-transition day — which isn't
  // 24h long — still rolls over to the correct next calendar day.
  var tomorrowGuess = new Date(Date.UTC(wall.year, wall.month, wall.date + 1, 12, 0, 0, 0) + wall.offsetMin * 60000);
  var tomorrowNoon = displayLocalNoon(tomorrowGuess);
  cachedTomorrow = computeDayEvents(tomorrowNoon, displayOffsetMinutes(tomorrowNoon), currentLat, currentLon);

  lastLocalDateStr = wall.year + "-" + wall.month + "-" + wall.date;
}

var markMidnight = document.getElementById("mark-solar-midnight");
var markNoon = document.getElementById("mark-solar-noon");
var markSunrise = document.getElementById("mark-sunrise");
var markSunset = document.getElementById("mark-sunset");
markSunrise.appendChild(phaseGlyph(0, 0, 14, "half-top", "#ffbf00"));
markSunset.appendChild(phaseGlyph(0, 0, 14, "half-bottom", "#ffbf00"));
var sunMarkRadius = 180; // between the clock (150) and hour (200) rings

// Places a half-yellow-circle glyph by translate only (never rotate — the
// glyph itself must stay upright as it moves around the ring).
function placeSunGlyph(group, utcToday, utcTomorrow, p) {
  var fToday = dayFractionOf(utcToday, cachedToday.offsetMin);
  var fTomorrow = dayFractionOf(utcTomorrow, cachedTomorrow.offsetMin);
  if (fToday === null || fTomorrow === null) {
    group.setAttribute("display", "none"); // polar day/night: nothing to draw
    return;
  }
  group.removeAttribute("display");
  var angle = blendFraction(fToday, fTomorrow, p) * 2 * Math.PI;
  var x = sunMarkRadius * Math.sin(angle);
  var y = -sunMarkRadius * Math.cos(angle);
  group.setAttribute("transform", "translate(" + x + "," + y + ")");
}

// Recomputed every animation frame from cachedToday/cachedTomorrow, so all
// four marks creep continuously rather than stepping once a day. Solar
// midnight is derived as noon's blend plus exactly half a turn, not blended
// independently, so the two stay exactly 180 degrees apart always, by
// construction, not by coincidence of matching inputs.
//
// p is the CIVIL-day fraction — the same quantity driving the hour hand
// (hourFraction), not a solar-day fraction of its own. The events being
// blended (noon, sunrise, sunset) are solar. Mixing a civil clock with
// solar events is deliberate: this ring is anchored to civil midnight (its
// 0% mark), so everything on it, including how fast the sun-events drift
// across it, is paced by the same civil clock as the hour hand. One clock
// drives everything. Don't "fix" this into a solar-day fraction later —
// that would desynchronize the marks from the ring's own 0% reference and
// from the hour hand they share the dial with.
function updateSunMarks(p) {
  // No location established yet (or it failed) — hide all four
  // location-dependent marks rather than draw them from a guess. Same
  // display:none mechanism placeSunGlyph uses below for polar day/night.
  if (locationStatus !== "located" && locationStatus !== "manual") {
    markMidnight.setAttribute("display", "none");
    markNoon.setAttribute("display", "none");
    markSunrise.setAttribute("display", "none");
    markSunset.setAttribute("display", "none");
    return;
  }
  markMidnight.removeAttribute("display");
  markNoon.removeAttribute("display");

  var fNoonToday = dayFractionOf(cachedToday.noon, cachedToday.offsetMin);
  var fNoonTomorrow = dayFractionOf(cachedTomorrow.noon, cachedTomorrow.offsetMin);
  var noonBlend = blendFraction(fNoonToday, fNoonTomorrow, p);
  var midnightBlend = (noonBlend + 0.5) % 1;

  markNoon.setAttribute("transform", "rotate(" + (noonBlend * 360) + ")");
  markMidnight.setAttribute("transform", "rotate(" + (midnightBlend * 360) + ")");

  placeSunGlyph(markSunrise, cachedToday.sunrise, cachedTomorrow.sunrise, p);
  placeSunGlyph(markSunset, cachedToday.sunset, cachedTomorrow.sunset, p);
}

function updateLocationInfo() {
  var text;
  if (locationStatus === "manual") {
    text = (manualCityLabel || "Selected city") + " · timezone: " + displayTimeZone + " · manual";
  } else if (locationStatus === "located") {
    var latDir = currentLat >= 0 ? "N" : "S";
    var lonDir = currentLon >= 0 ? "E" : "W";
    text = Math.abs(currentLat).toFixed(2) + " " + latDir + ", "
      + Math.abs(currentLon).toFixed(2) + " " + lonDir + " · timezone: " + tzName + " · located";
  } else if (locationStatus === "locating") {
    text = "Locating" + (locationFailureReason ? " (retrying after " + locationFailureReason + ")" : "…");
  } else {
    text = "Location unavailable" + (locationFailureReason ? " (" + locationFailureReason + ")" : "");
  }
  document.getElementById("location-info").textContent = text;

  // City search only makes sense once geolocation has actually failed; the
  // clear/retry button only makes sense once a manual city is active.
  document.getElementById("city-search-container").style.display = locationStatus === "unavailable" ? "block" : "none";
  document.getElementById("clear-location-btn").style.display = locationStatus === "manual" ? "inline-block" : "none";
  if (locationStatus !== "unavailable") {
    document.getElementById("city-search-input").value = "";
    document.getElementById("city-search-results").innerHTML = "";
  }
}

// Open-Meteo geocoding: keyless, CORS-enabled (access-control-allow-origin:
// *, confirmed with an actual fetch from a file:// page before this was
// built). The only network dependency in this file, and it is wired up
// only here — nothing on the located/manual/locating paths ever calls it.
var CITY_SEARCH_URL = "https://geocoding-api.open-meteo.com/v1/search";
var MANUAL_LOCATION_STORAGE_KEY = "threeBodyClock.manualLocation";
var citySearchDebounceTimer = null;

function cityLabel(result) {
  return result.name + (result.admin1 ? ", " + result.admin1 : "") + ", " + result.country;
}

function selectCity(result) {
  currentLat = result.latitude;
  currentLon = result.longitude;
  displayTimeZone = result.timezone;
  manualCityLabel = cityLabel(result);
  locationStatus = "manual";
  locationFailureReason = null;
  try {
    localStorage.setItem(MANUAL_LOCATION_STORAGE_KEY, JSON.stringify({
      lat: currentLat, lon: currentLon, tz: displayTimeZone, label: manualCityLabel
    }));
  } catch (e) {
    // storage unavailable (private browsing, quota) — selection still works this session
  }
  refreshDayEventCache();
  updateLocationInfo();
}

document.getElementById("city-search-input").addEventListener("input", function(e) {
  var query = e.target.value.trim();
  clearTimeout(citySearchDebounceTimer);
  var resultsEl = document.getElementById("city-search-results");
  if (query.length < 2) {
    resultsEl.innerHTML = "";
    return;
  }
  citySearchDebounceTimer = setTimeout(function() {
    fetch(CITY_SEARCH_URL + "?name=" + encodeURIComponent(query) + "&count=8&language=en&format=json")
      .then(function(r) { return r.json(); })
      .then(function(data) {
        resultsEl.innerHTML = "";
        (data.results || []).forEach(function(result) {
          var li = document.createElement("li");
          li.textContent = cityLabel(result);
          li.addEventListener("click", function() { selectCity(result); });
          resultsEl.appendChild(li);
        });
      })
      .catch(function() {
        // network hiccup during search — leave the list as it was, no crash, no alert
      });
  }, 300);
});

document.getElementById("clear-location-btn").addEventListener("click", function() {
  try { localStorage.removeItem(MANUAL_LOCATION_STORAGE_KEY); } catch (e) {}
  currentLat = null;
  currentLon = null;
  displayTimeZone = null;
  manualCityLabel = null;
  locationStatus = "locating";
  locationFailureReason = null;
  geoAttempt = 0;
  updateLocationInfo();
  requestLocation();
});

function loadPersistedManualLocation() {
  try {
    var raw = localStorage.getItem(MANUAL_LOCATION_STORAGE_KEY);
    if (!raw) return false;
    var saved = JSON.parse(raw);
    if (typeof saved.lat !== "number" || typeof saved.lon !== "number" || !saved.tz) return false;
    currentLat = saved.lat;
    currentLon = saved.lon;
    displayTimeZone = saved.tz;
    manualCityLabel = saved.label || null;
    locationStatus = "manual";
    return true;
  } catch (e) {
    return false;
  }
}

// A persisted manual city takes priority over geolocation entirely — if the
// user picked one deliberately, don't second-guess it on every reload.
// Otherwise updateSunMarks() hides the four location-dependent marks itself
// (locationStatus is still "locating"); nothing is drawn from a guess.
if (loadPersistedManualLocation()) {
  refreshDayEventCache();
} else {
  updateSunMarks(0);
}
updateLocationInfo();

// Geolocation requires https or localhost; opening the file directly from
// disk always falls back to "unavailable" (unsupported/blocked in that
// context), which is reported, not silently swapped for a default.
var GEO_MAX_ATTEMPTS = 3;
var geoAttempt = 0;

function requestLocation() {
  geoAttempt++;
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      currentLat = pos.coords.latitude;
      currentLon = pos.coords.longitude;
      displayTimeZone = null; // device's own zone, not a leftover manual one
      manualCityLabel = null;
      locationStatus = "located";
      locationFailureReason = null;
      refreshDayEventCache();
      updateLocationInfo();
    },
    function(err) {
      var code = err && err.code;

      // PERMISSION_DENIED: the browser will not re-prompt this session, so
      // retrying is pointless — go straight to unavailable.
      if (code === 1) {
        locationStatus = "unavailable";
        locationFailureReason = "denied";
        updateLocationInfo();
        return;
      }

      // POSITION_UNAVAILABLE (2) or TIMEOUT (3): transient, worth retrying
      // with backoff, up to GEO_MAX_ATTEMPTS total attempts.
      var reason = code === 3 ? "timeout" : "position unavailable";
      locationFailureReason = reason; // visible even mid-retry, not just on final failure
      if (geoAttempt < GEO_MAX_ATTEMPTS) {
        updateLocationInfo();
        setTimeout(requestLocation, 1000 * Math.pow(2, geoAttempt - 1)); // 1s, 2s
      } else {
        locationStatus = "unavailable";
        updateLocationInfo();
      }
    },
    // High accuracy is deliberately off: we need longitude, not metres — a
    // 100km position error moves solar noon by under 6 minutes — so the
    // fast, low-power path is the right one, not GPS-grade precision.
    { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 }
  );
}

if (locationStatus === "manual") {
  // Persisted city already loaded above — geolocation would only overwrite
  // a deliberate choice with a guess.
} else if (navigator.geolocation) {
  requestLocation();
} else {
  locationStatus = "unavailable";
  locationFailureReason = "unsupported";
  updateLocationInfo();
}

// --- Verification: none of this touches the live cachedToday/cachedTomorrow. ---

// 1. Noon and midnight must be exactly 180 degrees apart at every instant,
// all year — true by construction (midnight = noon's blend + half a turn),
// but confirmed here rather than just assumed.
(function verifyNoonMidnightOpposite() {
  var maxDev = 0;
  for (var day = 0; day < 366; day++) {
    var simDate = new Date(2026, 0, 1 + day, day % 24, (day * 37) % 60, 0);
    var todayNoon = localNoon(simDate);
    var evToday = computeDayEvents(todayNoon, todayNoon.getTimezoneOffset(), ROTTERDAM_LAT, ROTTERDAM_LON);
    var tomorrowDate = new Date(simDate.getFullYear(), simDate.getMonth(), simDate.getDate() + 1, 12, 0, 0, 0);
    var evTomorrow = computeDayEvents(tomorrowDate, tomorrowDate.getTimezoneOffset(), ROTTERDAM_LAT, ROTTERDAM_LON);
    var p = (simDate.getHours() + simDate.getMinutes() / 60) / 24;
    var fNoonT = dayFractionOf(evToday.noon, evToday.offsetMin);
    var fNoonM = dayFractionOf(evTomorrow.noon, evTomorrow.offsetMin);
    var noonBlend = blendFraction(fNoonT, fNoonM, p);
    var midnightBlend = (noonBlend + 0.5) % 1;
    var sep = (((midnightBlend - noonBlend) % 1) + 1) % 1 * 360;
    var dev = Math.abs(sep - 180);
    if (dev > maxDev) maxDev = dev;
  }
  console.log("Noon/midnight max deviation from 180° over a simulated year:", maxDev.toFixed(6) + "°");
})();

function angularDelta(a, b) {
  return ((b - a + 180) % 360 + 360) % 360 - 180;
}

// 2a. The wrap itself, exercised directly. A mark only risks a bad jump when
// its today/tomorrow fractions sit on opposite sides of the 0/1 seam — e.g.
// today's value is 358°, tomorrow's is 2°. blendFraction() must read that as
// a short 4° hop, not walk the long way round (356°). Solar midnight is the
// mark that sits nearest this seam by definition (opposite noon, which sits
// near civil noon), so it's the one this matters for in practice — but the
// safest check is the primitive itself, stepped at minute resolution across
// a full day, independent of whether any real date happens to land exactly
// on the seam this century.
(function verifyBlendWrapSafety() {
  var fA = 358 / 360, fB = 2 / 360; // straddles 0°: short way is 4°, long way is 356°
  var prevDeg = null, maxStep = 0;
  for (var m = 0; m <= 1440; m++) {
    var deg = blendFraction(fA, fB, m / 1440) * 360;
    if (prevDeg !== null) maxStep = Math.max(maxStep, Math.abs(angularDelta(prevDeg, deg)));
    prevDeg = deg;
  }
  var totalTravel = Math.abs(angularDelta(fA * 360, fB * 360));
  console.log("Synthetic 0° crossing — total travel:", totalTravel.toFixed(2) + "° (short way, not 356°), max per-minute step:", maxStep.toFixed(4) + "°");
})();

// 2b. The same check against real Rotterdam data, stepping across the local
// midnight where solar midnight's mark comes closest to the ring's top all
// year (found by scanning 2026: closest approach is ~6.4°, on 2 -> 3 Nov,
// the date the clocks change — never a true crossing for this location, but
// the closest real rehearsal of it, and it exercises the actual
// rollover-triggered cache refresh in refreshDayEventCache(), which the
// synthetic check above does not: that refresh is the one place a
// discontinuity could sneak in even if the blend primitive itself is sound.
(function verifyMidnightContinuityRealData() {
  var simDate = new Date(2026, 10, 2, 23, 50, 0, 0);
  var simToday = null, simTomorrow = null, simDateStr = null;
  var prev = null;
  var maxJump = 0;
  var firstMidnightAngle = null;
  for (var i = 0; i < 30; i++) {
    var dateStr = simDate.toDateString();
    if (dateStr !== simDateStr) {
      var todayNoon = localNoon(simDate);
      simToday = computeDayEvents(todayNoon, todayNoon.getTimezoneOffset(), ROTTERDAM_LAT, ROTTERDAM_LON);
      var tmr = new Date(simDate.getFullYear(), simDate.getMonth(), simDate.getDate() + 1, 12, 0, 0, 0);
      simTomorrow = computeDayEvents(tmr, tmr.getTimezoneOffset(), ROTTERDAM_LAT, ROTTERDAM_LON);
      simDateStr = dateStr;
    }
    var p = (simDate.getHours() + (simDate.getMinutes() + simDate.getSeconds() / 60) / 60) / 24;
    var noonAngle = blendFraction(dayFractionOf(simToday.noon, simToday.offsetMin), dayFractionOf(simTomorrow.noon, simTomorrow.offsetMin), p) * 360;
    var midnightAngle = (noonAngle / 360 + 0.5) % 1 * 360;
    var sunriseAngle = blendFraction(dayFractionOf(simToday.sunrise, simToday.offsetMin), dayFractionOf(simTomorrow.sunrise, simTomorrow.offsetMin), p) * 360;
    var sunsetAngle = blendFraction(dayFractionOf(simToday.sunset, simToday.offsetMin), dayFractionOf(simTomorrow.sunset, simTomorrow.offsetMin), p) * 360;
    if (firstMidnightAngle === null) firstMidnightAngle = midnightAngle;

    if (prev) {
      maxJump = Math.max(maxJump,
        Math.abs(angularDelta(prev.noon, noonAngle)),
        Math.abs(angularDelta(prev.midnight, midnightAngle)),
        Math.abs(angularDelta(prev.sunrise, sunriseAngle)),
        Math.abs(angularDelta(prev.sunset, sunsetAngle)));
    }
    prev = { noon: noonAngle, midnight: midnightAngle, sunrise: sunriseAngle, sunset: sunsetAngle };
    simDate = new Date(simDate.getTime() + 60000);
  }
  console.log("Max per-minute mark jump stepping across 2->3 Nov local midnight (solar-midnight mark starts at " + firstMidnightAngle.toFixed(1) + "° from top, its closest approach all year):", maxJump.toFixed(4) + "°");
})();

// 3. Solar noon in Rotterdam should read near 13:48 in summer and 12:48 in
// winter — never 12:00 — since it's mean solar noon corrected by longitude
// and the equation of time, not civil noon.
(function() {
  var summerNoon = new Date(2026, 5, 21, 12, 0, 0, 0);
  var winterNoon = new Date(2025, 11, 21, 12, 0, 0, 0);
  console.log("Solar noon 2026-06-21 (summer):", minutesToLocalTime(
    computeDayEvents(summerNoon, summerNoon.getTimezoneOffset(), ROTTERDAM_LAT, ROTTERDAM_LON).noon, 2));
  console.log("Solar noon 2025-12-21 (winter):", minutesToLocalTime(
    computeDayEvents(winterNoon, winterNoon.getTimezoneOffset(), ROTTERDAM_LAT, ROTTERDAM_LON).noon, 1));
})();

// 4. The structural guarantee: the hour hand (via displayWallClock) and the
// sun-event marks (via computeDayEvents, fed displayOffsetMinutes) must
// resolve to the SAME offset for the same instant, in any timezone —
// including a southern-hemisphere zone (opposite DST season) and a
// half-hour-offset zone (Kathmandu, +05:45, not a whole number of hours).
// This isn't a coincidence to verify after the fact: both call through
// displayOffsetMinutes()/displayWallClock() and nothing else, so there is
// no second code path left that could resolve a different zone for one
// than the other — the check below confirms that wiring holds for each
// zone, not that two independent implementations happen to agree.
(function verifyHandMarksShareOffset() {
  var savedTZ = displayTimeZone;
  var zones = [
    { tz: "Europe/Amsterdam", lat: 52.37, lon: 4.90 },
    { tz: "Australia/Sydney", lat: -33.87, lon: 151.21 },  // southern hemisphere
    { tz: "Asia/Kathmandu", lat: 27.70, lon: 85.32 },       // +05:45, half-hour offset
    { tz: "America/St_Johns", lat: 47.56, lon: -52.71 }     // -03:30, half-hour offset
  ];
  var instant = new Date(Date.UTC(2026, 5, 15, 12, 0, 0, 0));
  var allMatch = true;
  zones.forEach(function(z) {
    displayTimeZone = z.tz;
    var handOffset = displayWallClock(instant).offsetMin;
    var noonInstant = displayLocalNoon(instant);
    var markOffset = computeDayEvents(noonInstant, displayOffsetMinutes(noonInstant), z.lat, z.lon).offsetMin;
    var match = handOffset === markOffset;
    if (!match) allMatch = false;
    console.log("Hand/mark offset — " + z.tz + ": hand=" + handOffset + "min, mark=" + markOffset + "min, match=" + match);
  });
  displayTimeZone = savedTZ;
  console.log("All zones' hand and marks agree on offset:", allMatch);
})();

var initK = fullMoonK(initJD);
var initThisFM = ph(initK, 0.5);
var initNextFM = ph(initK + 1, 0.5);
var initMonthLen = initNextFM - initThisFM;

var lastQuarterJDE = phQuarter(initK, 0.75);
var newMoonJDE = ph(initK + 1, 0.0);
var firstQuarterJDE = phQuarter(initK + 1, 0.25);

buildMoonPhaseMarks("ticks-lunar", 228, 14);

function jdeToISO(j) {
  return new Date((j - 2440587.5) * 86400000).toISOString();
}
console.log("Full moon (opens month, 0%):", jdeToISO(initThisFM));
console.log("Last quarter (25%):", jdeToISO(lastQuarterJDE));
console.log("New moon (50%):", jdeToISO(newMoonJDE));
console.log("First quarter (75%):", jdeToISO(firstQuarterJDE));
console.log("Full moon (closes month, 100%):", jdeToISO(initNextFM));

console.log("Elongation fraction @ full moon (expect 0.0000):", lunarPointerFraction(initThisFM).toFixed(4));
console.log("Elongation fraction @ last quarter (expect 0.2500):", lunarPointerFraction(lastQuarterJDE).toFixed(4));
console.log("Elongation fraction @ new moon (expect 0.5000):", lunarPointerFraction(newMoonJDE).toFixed(4));
console.log("Elongation fraction @ first quarter (expect 0.7500):", lunarPointerFraction(firstQuarterJDE).toFixed(4));

var oldInterpolated = 0.37812;
var newElongFraction = lunarPointerFraction(2461262.00000);
console.log("Old interpolated fraction @ JD 2461262.00000:", oldInterpolated);
console.log("New elongation fraction @ JD 2461262.00000:", newElongFraction.toFixed(5));
console.log("Difference in degrees of ring:", ((newElongFraction - oldInterpolated) * 360).toFixed(3) + "°");

var initSolY = solsticeYear(initJD);
var initThisSol = solarLongitudeCrossing(270, seedJD(initSolY, 12, 21));
var initNextSol = solarLongitudeCrossing(270, seedJD(initSolY + 1, 12, 21));
var initMarEq = solarLongitudeCrossing(0, seedJD(initSolY + 1, 3, 20));
var initJunSol = solarLongitudeCrossing(90, seedJD(initSolY + 1, 6, 21));
var initSepEq = solarLongitudeCrossing(180, seedJD(initSolY + 1, 9, 22));
var initYearLen = initNextSol - initThisSol;

var fMarEq = (initMarEq - initThisSol) / initYearLen;
var fJunSol = (initJunSol - initThisSol) / initYearLen;
var fSepEq = (initSepEq - initThisSol) / initYearLen;

buildSunPhaseMarks("ticks-solar", 281, 14);

var winterDeg = fMarEq * 360;
var springDeg = (fJunSol - fMarEq) * 360;
var summerDeg = (fSepEq - fJunSol) * 360;
var autumnDeg = (1 - fSepEq) * 360;
console.log("Winter season:", winterDeg.toFixed(1) + "°");
console.log("Spring season:", springDeg.toFixed(1) + "°");
console.log("Summer season:", summerDeg.toFixed(1) + "°");
console.log("Autumn season:", autumnDeg.toFixed(1) + "°");

console.log("2026 December solstice (crossing fn):", jdeToISO(solarLongitudeCrossing(270, seedJD(2026, 12, 21))));

var verifyJD = 2461262.00000;
console.log("Verify @ JD " + verifyJD + " — apparent longitude:", sunLongitude(verifyJD).toFixed(4) + "°, ring fraction:", solarPointerFraction(verifyJD).toFixed(5));

console.log("Current lunar pointer fraction:", lunarPointerFraction(initJD).toFixed(4));
console.log("Current solar pointer fraction:", solarPointerFraction(initJD).toFixed(4));

function minutesToLocalTime(minUTC, utcOffsetHours) {
  var total = ((minUTC + utcOffsetHours * 60) % 1440 + 1440) % 1440;
  var hh = Math.floor(total / 60);
  var mm = Math.round(total % 60);
  if (mm === 60) { mm = 0; hh = (hh + 1) % 24; }
  return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
}

[
  { date: [2026, 8, 9], utcOffset: 2, expect: "06:17 / 21:18 CEST" },
  { date: [2025, 12, 21], utcOffset: 1, expect: "08:48 / 16:33 CET" },
  { date: [2026, 6, 21], utcOffset: 2, expect: "05:22 / 22:05 CEST" }
].forEach(function(c) {
  var jd = seedJD(c.date[0], c.date[1], c.date[2]);
  var ev = sunEvents(jd, ROTTERDAM_LAT, ROTTERDAM_LON);
  var got = minutesToLocalTime(ev.sunrise, c.utcOffset) + " / " + minutesToLocalTime(ev.sunset, c.utcOffset);
  console.log("Sunrise/sunset " + c.date.join("-") + ":", got, " expect:", c.expect);
});

var handHours = document.getElementById("hand-hours");
var handLunar = document.getElementById("hand-lunar");
var handSolar = document.getElementById("hand-solar");
var handClockHour = document.getElementById("hand-clock-hour");
var handClockMinute = document.getElementById("hand-clock-minute");
var handClockSecond = document.getElementById("hand-clock-second");

function tick() {
  var now = new Date();
  var haveLocation = locationStatus === "located" || locationStatus === "manual";

  // Single source of truth for both the hour ring and the sun-event marks
  // (see displayOffsetMinutes/displayWallClock above) — also drives the
  // 12-hour analog face, so the whole dial reads one consistent civil time
  // rather than the ring and the clock face disagreeing with each other.
  // Until a location is found or entered, civil time isn't meaningful yet
  // (displayTimeZone would just be guessing at device-local), so all civil
  // hands point straight up instead of ticking on an unearned assumption.
  var wall = haveLocation ? displayWallClock(now) : null;
  var secFraction = haveLocation ? (wall.seconds + wall.milliseconds / 1000) / 60 : 0;
  var minFraction = haveLocation ? (wall.minutes + secFraction) / 60 : 0;
  var hourFraction = haveLocation ? (wall.hours + minFraction) / 24 : 0;
  handHours.setAttribute("transform", "rotate(" + (hourFraction * 360) + ")");

  var clockHourFraction = haveLocation ? ((wall.hours % 12) + minFraction) / 12 : 0;
  handClockHour.setAttribute("transform", "rotate(" + (clockHourFraction * 360) + ")");
  handClockMinute.setAttribute("transform", "rotate(" + (minFraction * 360) + ")");
  handClockSecond.setAttribute("transform", "rotate(" + (secFraction * 360) + ")");

  var jd = Date.now() / 86400000 + 2440587.5;
  var lunarFraction = lunarPointerFraction(jd);
  handLunar.setAttribute("transform", "rotate(" + (lunarFraction * 360) + ")");

  var solarFraction = solarPointerFraction(jd);
  handSolar.setAttribute("transform", "rotate(" + (solarFraction * 360) + ")");

  // The blend itself runs every frame, so the marks are always continuous.
  updateSunMarks(hourFraction);

  // Only the cache behind that blend is throttled — checked once a minute,
  // not every frame, and only refreshed on an actual date rollover (in the
  // display timezone, via the same `wall` used for the hand above).
  var nowMs = Date.now();
  if (nowMs - lastSunMarksCheck >= 60000) {
    lastSunMarksCheck = nowMs;
    if (haveLocation) {
      var todayKey = wall.year + "-" + wall.month + "-" + wall.date;
      if (todayKey !== lastLocalDateStr) {
        refreshDayEventCache(now);
      }
    }
  }

  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
